<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Macro Trading OS</title>
<style>:root{--bg:#081018;--panel:#111e2a;--line:#294052;--text:#eaf1f5;--muted:#92a9b9;--cyan:#38d9d0;--red:#ff7373;--green:#54d69c;--amber:#ffc461}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% -10%,#173852 0,transparent 32%),var(--bg);color:var(--text);font:14px/1.5 Segoe UI,system-ui,sans-serif}.shell{min-height:100vh;display:grid;grid-template-columns:220px 1fr}.side{position:sticky;top:0;height:100vh;padding:24px 15px;border-right:1px solid var(--line);background:#09131ddd}.brand{font-weight:800;letter-spacing:.14em;font-size:17px;margin:0 10px}.sub,.small{color:var(--muted);font-size:11px}.sub{margin:2px 10px 28px}.nav a{display:block;color:var(--muted);text-decoration:none;text-transform:capitalize;padding:11px;border-radius:8px;margin:3px}.nav a:hover,.nav a.on{background:#172735;color:var(--text)}.safety{position:absolute;bottom:18px;left:20px;color:var(--muted);font-size:10px}.top{position:sticky;top:0;z-index:3;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:13px 26px;background:#081018ee;border-bottom:1px solid var(--line)}.top strong{margin-right:auto}.badge,.pill{border:1px solid var(--line);border-radius:999px;padding:3px 8px;font-size:10px;color:var(--muted)}.badge.ok,.pill.ok{color:var(--green);border-color:#285c49}.badge.warn,.pill.bad{color:var(--amber);border-color:#685326}.pill.bad{color:var(--red);border-color:#6b3838}.pill.future{color:#75a0ff}.content{padding:28px;max-width:1500px;margin:auto}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}.head h1{font-size:28px;margin:0}.head p{color:var(--muted);margin:3px 0}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:13px}.card{grid-column:span 3;background:linear-gradient(145deg,#172735,var(--panel));border:1px solid var(--line);border-radius:11px;padding:16px}.card.wide{grid-column:span 6}.card.full{grid-column:1/-1}.label{font-size:10px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}.value{font-size:17px;font-weight:700;margin:6px 0;overflow-wrap:anywhere}table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line)}th,td{padding:10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:10px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}tr[data-id]{cursor:pointer}tr[data-id]:hover{background:#172735}.timeline{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:16px 0}.stage,.factor{padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:7px;overflow-wrap:anywhere}.stage b{display:block;font-size:9px;color:var(--muted)}.factor{margin:7px 0;border-left:2px solid var(--cyan)}.lane{border-top:3px solid #5d8dff}.lane.alt{border-color:var(--cyan)}.section{margin-top:22px}.mode{display:grid;grid-template-columns:38px 1fr repeat(5,80px);gap:8px;padding:10px;border-bottom:1px solid var(--line)}.yes{color:var(--green)}.no{color:var(--muted)}button,input{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:8px 10px;color:var(--text)}button{cursor:pointer}button:hover{border-color:var(--cyan)}input{width:100%;margin-bottom:12px}.error{border:1px solid #753a3a;background:#2b1717;padding:16px;border-radius:8px;color:#ffb8b8}@media(max-width:900px){.shell{grid-template-columns:76px 1fr}.brand{font-size:11px}.sub,.nav span,.safety{display:none}.card{grid-column:span 6}.mode{grid-template-columns:30px 1fr repeat(5,52px);font-size:10px}}@media(max-width:600px){.shell{display:block}.side{height:auto;position:static}.nav{display:flex;overflow:auto}.nav span{display:block}.card,.card.wide{grid-column:1/-1}.content{padding:16px}.timeline{grid-template-columns:1fr 1fr}}.feed-list{display:grid;gap:12px}.feed-entry{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}.feed-entry h2{font-size:18px;margin:8px 0}.feed-meta{color:var(--muted);font-size:12px;overflow-wrap:anywhere}.feed-state{font-weight:700}.feed-entry p{white-space:pre-wrap;overflow-wrap:anywhere}
/* Radar-only presentation: all other unified app pages keep their existing styles. */
.radar-brand{display:none}body:has(.radar-feed) .app-brand{display:none}body:has(.radar-feed) .radar-brand{display:inline}body:has(.radar-feed) #mode,body:has(.radar-feed) #strategy,body:has(.radar-feed) #ready{display:none}body:has(.radar-feed) .shell{grid-template-columns:176px 1fr}body:has(.radar-feed) .content{padding:26px 32px;max-width:1540px}body:has(.radar-feed) .top{padding:16px 32px}body:has(.radar-feed) .safety{font-size:0}body:has(.radar-feed) .safety:after{content:'LOCAL · READ ONLY';font-size:11px;letter-spacing:.08em}
.radar-feed{--radar-subtle:#abc0ce}.radar-feed .head{margin-bottom:16px;align-items:center}.radar-feed .head h1{font-size:32px;letter-spacing:-.025em}.radar-feed .head p{font-size:14px;max-width:780px;margin-top:5px}.radar-feed .head button{padding:9px 16px;font-size:13px}.radar-layers{display:flex;align-items:center;gap:14px;color:var(--radar-subtle);font-size:12px;margin:0 0 18px}.radar-layers span{display:flex;gap:7px;align-items:center}.radar-layers b{font-weight:500;color:var(--text)}.radar-layers i{font-style:normal;color:#627f94}.radar-summary{margin-bottom:12px}.radar-summary .card{grid-column:span 4;padding:17px 20px;background:#111f2c;border-color:#263d50}.radar-summary .value{font-size:34px;line-height:1.15;margin:8px 0 5px;letter-spacing:-.025em}.radar-summary .label{font-size:12px;letter-spacing:.08em}.radar-summary .small{font-size:12px}.radar-context{display:flex;gap:12px 24px;flex-wrap:wrap;font-size:12px;color:var(--radar-subtle);padding:10px 0 18px}.radar-context strong{font-weight:500;color:var(--text)}.radar-section-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin:12px 0 16px}.radar-section-head h2{font-size:22px;letter-spacing:-.02em;margin:0}.radar-section-head p{margin:4px 0 0;font-size:13px;color:var(--radar-subtle);max-width:850px}.radar-section-head .small{white-space:nowrap;font-size:12px}.canonical-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.event-card{background:#101e2b;border:1px solid #2a4052;border-radius:12px;padding:22px;min-width:0}.event-card.has-evidence{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:start}.event-card h2{font-size:22px;line-height:1.35;margin:12px 0 14px;font-weight:650;letter-spacing:-.015em;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.radar-feed .discovery-status{color:#e1bd75;background:#302b1d;border-color:#514a32;letter-spacing:.025em;font-size:11px;padding:4px 9px}.event-meta{font-size:13px;color:var(--radar-subtle);margin:5px 0;overflow-wrap:anywhere}.event-counts{font-size:12px;color:var(--radar-subtle)}.event-times{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:17px 0 12px;color:var(--radar-subtle);font-size:12px}.event-times span{display:block;color:#7f9bad;margin-bottom:3px}.event-times time{overflow-wrap:anywhere}.event-provenance{margin-top:12px;font-size:12px;color:#8faabd}.event-provenance summary,.radar-source-details summary,.news-discovery summary{cursor:pointer}.event-provenance[open] .feed-meta{margin-top:9px}.official-panel{margin:0;padding:19px 20px;border-radius:9px;background:#112c30;border-left:3px solid #64c9bc;min-width:0}.official-panel h3{font-size:16px;line-height:1.35;margin:0 0 6px;color:#d7f4ed;font-weight:650}.official-panel .small{font-size:12px;color:#adcac7;line-height:1.5}.official-record{padding:14px 0 0;margin-top:13px;border-top:1px solid #305052}.official-authority{font-size:13px;color:#d4e9e5}.official-fact{font-size:17px;line-height:1.5;color:#eefaf7;margin:11px 0 13px;white-space:pre-wrap;overflow-wrap:anywhere}.official-fact span{display:block;text-transform:uppercase;letter-spacing:.09em;font-size:10px;color:#9cc8c0;margin-bottom:5px}.official-record .feed-meta{color:#b6d0ca;font-size:12px;margin-top:7px}.official-record a{color:#9ee5d9;text-underline-offset:3px;overflow-wrap:anywhere}.proposition-status{font-size:10px;color:#a6d8ce;letter-spacing:.025em;margin-top:12px}.no-official-evidence{font-size:12px;color:#819bae;margin-top:15px}.radar-source-details{margin:22px 0;border-top:1px solid var(--line);padding-top:14px;color:var(--radar-subtle);font-size:12px}.radar-source-details .grid{margin-top:14px}.radar-source-details .card{grid-column:span 4}.news-discovery{margin:26px 0 12px;border-top:1px solid #294052;padding-top:18px}.news-discovery summary{font-size:19px;font-weight:600;color:#e0ebf1}.news-discovery>p{font-size:13px;color:var(--radar-subtle)}.news-discovery .feed-entry{border-color:#23384a;padding:18px}.news-discovery .feed-entry h2{font-size:18px;line-height:1.4}.radar-feed a{color:#8eddd5;text-underline-offset:3px}.radar-empty{padding:24px;color:var(--radar-subtle);background:#101e2b;border-radius:10px}.radar-feed details summary:focus-visible,.radar-feed button:focus-visible{outline:2px solid var(--cyan);outline-offset:4px}
.radar-feed .radar-demo-notice{margin:0 0 16px;padding:12px 16px;border:1px solid #36515e;border-radius:9px;background:#142b32;color:#b8d0d6;font-size:12px;line-height:1.5}.radar-demo-notice strong{color:#d9f1ee;letter-spacing:.06em;font-size:11px}.radar-demo-notice p{margin:4px 0}.radar-demo-notice a{color:#9ee5d9;text-underline-offset:3px}
@media(max-width:1000px){.event-card.has-evidence{grid-template-columns:1fr;gap:18px}.canonical-grid{grid-template-columns:1fr}.radar-layers{flex-wrap:wrap}}@media(max-width:900px){body:has(.radar-feed) .shell{grid-template-columns:76px 1fr}body:has(.radar-feed) .content{padding:24px}.radar-summary .value{font-size:28px}.radar-summary .card{padding:14px}.radar-summary .small{font-size:11px}.radar-layers{gap:8px}}@media(max-width:600px){body:has(.radar-feed) .shell{display:block}body:has(.radar-feed) .content{padding:18px}body:has(.radar-feed) .top{padding:13px 18px}.radar-feed .head h1{font-size:27px}.radar-summary .card,.radar-source-details .card{grid-column:1/-1}.radar-section-head{display:block}.radar-section-head .small{margin-top:7px}.event-card{padding:18px}.event-card h2{font-size:20px}.event-times{grid-template-columns:1fr}.radar-layers i{display:none}.radar-context{padding-bottom:10px}}
</style></head>
<body><div class="shell"><aside class="side"><div class="brand"><span class="app-brand">MACRO OS</span><span class="radar-brand">RADAR</span></div><div class="sub"><span class="app-brand">LOCAL OPERATIONS</span><span class="radar-brand">EVENT INTELLIGENCE</span></div><nav id="nav" class="nav"></nav><div class="safety">LOCALHOST ONLY<br>NO SHADOW · NO PNL · USD 0</div></aside><main><header class="top"><strong><span class="app-brand">MACRO TRADING OS</span><span class="radar-brand">GLOBAL EVENT RADAR</span></strong><span id="mode" class="badge">MODE —</span><span class="badge ok">LOCALHOST</span><span id="strategy" class="badge">STRATEGY —</span><span id="ready" class="badge warn">READINESS —</span></header><div id="app" class="content"><div class="card full">Loading canonical view…</div></div></main></div>
<script>
const APP_CONFIG=window.__MACRO_OS_CONFIG__||{},pages=APP_CONFIG.radarOnly?['feed']:['overview','events','feed','shadow','strategy','research','providers','system'],esc=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const route=()=>{if(APP_CONFIG.radarOnly)return{page:'feed',id:undefined};let [page,id]=(location.hash.replace(/^#\/?/,'')||'overview').split('/');return{page:pages.includes(page)?page:'overview',id}},api=async p=>{let r=await fetch(p),j=await r.json();if(!r.ok)throw Error(j.error||r.status);return j};
const pill=x=>{x=String(x??'—');let c=/BLOCK|FORBIDDEN|MISSING/.test(x)?'bad':/READY|PASS|ALLOWED|CANONICAL/.test(x)?'ok':/FUTURE|NOT_BEFORE/.test(x)?'future':'';return `<span class="pill ${c}">${esc(x)}</span>`},card=(l,v,s='',w='')=>`<article class="card ${w}"><div class="label">${esc(l)}</div><div class="value">${esc(v)}</div><div class="small">${esc(s)}</div></article>`,head=(h,p)=>`<div class="head"><div><h1>${esc(h)}</h1><p>${esc(p)}</p></div><button onclick="load()">Refresh</button></div>`;
function showNav(){let r=route();nav.innerHTML=pages.map(x=>`<a class="${x===r.page?'on':''}" href="#/${x}"><span>${x}</span></a>`).join('')}
function overview(v){let c=v.cards;return head('Operations Overview','Current canonical local system state')+`<div class="grid">${card('System',c.system_status.application,c.system_status.mode)}${card('Next event',c.next_event.event_id,c.next_event.scheduled_timestamp)}${card('Research',c.current_research.status,c.current_research.holdout_id+' · 6 released / 12 future')}${card('Shadow readiness',c.shadow_readiness.ready?'READY':'BLOCKED','Policy allowed · execution not authorized')}${card('Runtime',c.runtime.status,c.runtime.health)}${card('Provider',c.provider_status.status,c.provider_status.classification)}${card('Active blockers',c.active_blockers.length,c.active_blockers.join(' · '),'wide')}${card('Authority',c.authority_status.shadow,'Paper / Broker / Live not authorized','wide')}</div>`}
function eventTable(v){return `<table><thead><tr><th>Event</th><th>Family</th><th>Scheduled UTC</th><th>Occurrence</th><th>Direction</th><th>Lifecycle</th><th>Blocker</th></tr></thead><tbody>${v.events.map(e=>`<tr data-id="${esc(e.event_id)}" onclick="location.hash='#/events/${esc(e.event_id)}'"><td>${esc(e.event_id)}</td><td>${esc(e.event_family)}</td><td>${esc(e.scheduled_timestamp)}</td><td>${pill(e.occurrence_status)}</td><td>${pill(e.direction_status)}</td><td>${pill(e.overall_lifecycle_status)}</td><td>${e.blocker?pill(e.blocker.class):'—'}</td></tr>`).join('')}</tbody></table>`}
function events(v){return head('Events','18-event PIT lifecycle · no performance fields')+`<input placeholder="Filter event or family" oninput="document.querySelectorAll('tr[data-id]').forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(this.value.toLowerCase()))">`+eventTable(v)}
function safeEvidenceLink(value){if(typeof value!=="string"||!value.trim())return "Not available";try{const u=new URL(value,location.href);if(!["http:","https:"].includes(u.protocol))return esc(value);const href=esc(u.href);return `<a href="${href}" target="_blank" rel="noopener noreferrer">${esc(value)}</a>`}catch{return esc(value)}}
function officialEvidenceSection(event,view){const ids=new Set(event.official_evidence_ids||[]);const evidence=(view.official_evidence||[]).filter(e=>ids.has(e.official_evidence_id)&&e.canonical_event_id===event.event_id&&e.evidence_status==='OFFICIAL_CONFIRMED'&&typeof e.fact_proposition==='string'&&e.fact_proposition.trim());if(!evidence.length)return '<div class="no-official-evidence">No official evidence linked</div>';return `<section class="official-panel"><h3>Official Evidence — specific facts only</h3><div class="small">Documents support these propositions, not every claim in the News title.</div>${evidence.map(e=>`<div class="official-record" data-evidence-status="${esc(e.evidence_status)}"><div class="official-authority">Authority: <strong>${esc(e.authority_name||'Unknown')}</strong></div><p class="official-fact"><span>Fact confirmed:</span>${esc(e.fact_proposition)}</p><div class="feed-meta">Document: ${esc(e.document_title||'Unknown')}</div><div class="feed-meta">Published: ${esc(e.published_at||'Unknown')}</div><div class="feed-meta">Original official link: ${safeEvidenceLink(e.document_url)}</div><div class="proposition-status">${esc(e.evidence_status)} · proposition only</div><details class="event-provenance"><summary>Document reference</summary><div class="feed-meta">Reference: ${esc(e.document_reference||'Unknown')}</div></details></div>`).join('')}</section>`}
function canonicalEvents(v){const events=v.events||[];const cards=events.map(e=>`<article class="event-card ${e.official_evidence_count>0?'has-evidence':''}" data-event-status="${esc(e.verification_status||'UNVERIFIED_NEWS')}"><div class="event-main"><span class="pill discovery-status">${esc(e.verification_status||'UNVERIFIED_NEWS')}</span><h2 title="${esc(e.event_title||'Unknown title')}">${esc(e.event_title||'Unknown title')}</h2><div class="event-counts">Articles: ${esc(e.article_count??'Unknown')} · Named sources: ${esc(Array.isArray(e.source_names)?e.source_names.length:'Unknown')}</div><div class="event-meta">Sources: ${esc((e.source_names||[]).join(' · ')||'Unknown')}</div><div class="event-times"><div><span>First detected:</span><time>${esc(e.first_detected_at||'Unknown')}</time></div><div><span>Latest article:</span><time>${esc(e.latest_article_at||'Unknown')}</time></div></div><details class="event-provenance"><summary>Event details &amp; reference</summary><div class="feed-meta">Event reference: ${esc(e.event_id||'Unknown')}</div><div class="feed-meta">Full title: ${esc(e.event_title||'Unknown title')}</div></details>${e.official_evidence_count>0?'':officialEvidenceSection(e,v)}</div>${e.official_evidence_count>0?officialEvidenceSection(e,v):''}</article>`).join('');return `<section class="canonical-section" data-canonical-count="${esc(v.distinct_event_count??'Unknown')}"><div class="radar-section-head"><div><h2>Canonical Events</h2><p>Events derived conservatively from discovered news. Official evidence supports specific propositions only.</p></div><div class="small">V0 · ${esc(v.canonical_event_projection_status||'UNAVAILABLE')}</div></div><div class="canonical-grid">${cards||'<div class="radar-empty">No canonical events available.</div>'}</div><details class="event-provenance"><summary>Grouping &amp; identity notes</summary><div class="feed-meta">Limited rate-decision matching; other articles remain separate. IDs change when membership changes. Unassigned articles: ${esc(v.unassigned_article_count??'Unknown')}</div></details></section>`}
function eventFeed(v){const eventRows=Array.isArray(v.events)?v.events:[];const officialCount=Array.isArray(v.official_evidence)?v.official_evidence.filter(e=>e.evidence_status==='OFFICIAL_CONFIRMED'&&eventRows.some(event=>event.event_id===e.canonical_event_id&&(event.official_evidence_ids||[]).includes(e.official_evidence_id))).length:'Unknown';let sources=Object.entries(v.sources||{}).map(([k,x])=>card(k.replaceAll('_',' '),x.status||'UNKNOWN',x.last_success_at||'Last success unknown')).join('');let entries=(v.items||[]).map(e=>{const ref=e.article_reference||e.discovery_record_id;const reportedLabel=e.reported_time_kind==='SOURCE_DATE_PROXY'?'Source date (proxy)':'Reported time';return `<article class="feed-entry"><span class="pill discovery-status">${esc(e.verification_status||'UNVERIFIED_NEWS')}</span><h2>${esc(e.title||'Unknown title')}</h2><div class="feed-meta">Item reference: ${esc(ref||'Not available')}</div><div class="feed-meta">Source: ${esc(e.news_source?.name||'Not available')} · ${safeEvidenceLink(e.news_source?.url)}</div><div class="feed-meta">Observed by collector: ${esc(e.observed_at||e.discovered_at||'Not available')} · ${reportedLabel}: ${esc(e.reported_at||'Not available')}</div></article>`}).join('');return `<div class="radar-feed">`+head('Global Event Radar','Discover global news. Follow conservative event groups. Inspect the facts supported by official documents.')+(APP_CONFIG.demoMode?'<aside class="radar-demo-notice" aria-label="Public demo status"><strong>PUBLIC DEMO · READ-ONLY SNAPSHOT</strong><p>This demonstration uses a fixed validated dataset. Automated live ingestion is not enabled in this deployment.</p><div>Source: <a href="https://www.eia.gov/todayinenergy/" target="_blank" rel="noopener noreferrer">U.S. Energy Information Administration</a> · No EIA endorsement.</div></aside>':'')+`<div class="radar-layers" aria-label="Evidence hierarchy"><span><b>News Discovery</b> Discovery only</span><i>→</i><span><b>Canonical Events</b> Article groups</span><i>→</i><span><b>Official Evidence</b> Specific facts</span></div><div class="grid radar-summary">${card('News Articles',v.news_item_count??v.item_count??'Unknown','Source articles after article-level deduplication')}${card('Canonical Events',v.distinct_event_count??'Unknown','Conservative groups · not verified facts')}${card('Official Evidence',officialCount,'Explicitly linked fact propositions')}</div><div class="radar-context"><span>Feed: <strong>${esc(v.status||'UNKNOWN')}</strong>${v.reason?' · '+esc(v.reason):''}</span><span>Latest observed data: <strong>${esc(v.latest_observed_data_at||'Unknown')}</strong></span><span>Source health: <strong>${esc(v.health_status||'UNKNOWN')}</strong></span></div>`+canonicalEvents(v)+`<details class="news-discovery"><summary>News Discovery — Unverified · ${esc(v.news_item_count??v.item_count??'Unknown')} News Articles</summary><p>Original articles and source links. These reports remain discovery evidence.</p><div class="feed-list">${entries||`<div class="radar-empty">No News Discovery records available. Status: ${esc(v.status||'UNKNOWN')} · ${esc(v.reason||'No records')}</div>`}</div></details><details class="radar-source-details"><summary>Source availability &amp; freshness</summary><div class="small">Latest article observation is not collector health. Health remains UNKNOWN without per-source evidence.</div><div class="grid">${sources||card('Collector health','UNKNOWN','No per-source health evidence')}</div></details></div>`}
function detail(v){let e=v.event;return head(e.event_id,e.event_family+' · '+e.scheduled_timestamp)+`<div class="grid">${card('Occurrence',e.occurrence_status)}${card('Lifecycle',e.overall_lifecycle_status)}${card('Direction',e.direction_status)}${card('Authority',e.authority_state)}${e.blocker?card('Typed blocker',e.blocker.class,e.blocker.code,'wide'):''}${card('Evidence identity',e.event_identity_fingerprint,'Canonical compact provenance','wide')}</div><div class="timeline">${v.timeline.map(s=>`<div class="stage"><b>${esc(s.stage)}</b>${esc(s.status)}</div>`).join('')}</div>`}
function strategyView(v){return head('Frozen Strategy','Active strategy is not directly editable')+`<div class="grid">${card('Strategy',v.strategy_id,'','wide')}${card('Status',v.status,'Direct edit '+v.direct_edit)}${card('Polymarket',v.polymarket_dependency)}</div><div class="section">${Object.entries(v.factor_groups).map(([g,fs])=>`<div class="factor"><b>${esc(g)}</b>${fs.map(f=>`<div class="small">${esc(f.component_id)} · ${esc(f.current_value_or_state)} · ${esc(f.frozen_status)}</div>`).join('')}</div>`).join('')}</div><button onclick="location.hash='#/research'">Create development experiment via Research</button>`}
function research(v){return head('Research','Clean research and observational Shadow are separate lanes')+`<div class="grid">${v.lanes.map((l,i)=>`<article class="card wide lane ${i?'alt':''}"><div class="label">LANE ${esc(l.lane)}</div><div class="value">${esc(l.name)}</div><div class="small">Purpose ${esc(l.purpose)} · ${esc(l.status||l.pnl)}</div></article>`).join('')}${card('Clean holdout',v.clean_holdout.status,v.clean_holdout.holdout_id+' · Replay '+v.clean_holdout.final_replay,'wide')}${card('Experiments',v.experiment_registry.experiments.length,'Immutable development registry')}${card('Promotion',v.promotion_status)}</div>`}
function shadow(v){let r=v.runtime_engineering,g=v.governance;return head('Shadow Operations','Capability, readiness, policy, authority and activity are distinct')+`<div class="grid">${card('Runtime',r.status,r.mode)}${card('Realtime readiness',v.realtime_readiness.status,v.realtime_readiness.blockers.join(' · '),'wide')}${card('Execution authorized',v.execution_authorized?'YES':'NO','Active: NO')}${card('Policy',g.observational_shadow_policy,g.purpose)}${card('PnL',g.pnl,'Promotion '+g.promotion)}${card('Provider blocker',v.provider_blocker.class,v.provider_blocker.code,'wide')}</div>`}
function providers(v){return head('Providers','Capability and authority · zero requests in this campaign')+`<table><thead><tr><th>Provider</th><th>Capability</th><th>Active</th><th>Blocker / Authority</th></tr></thead><tbody>${v.providers.map(p=>`<tr><td>${esc(p.provider_id)}</td><td>${pill(p.capability)}</td><td>${pill(p.active)}</td><td>${esc(p.blocker||p.authority||'—')} ${p.classification?'· '+esc(p.classification):''}</td></tr>`).join('')}</tbody></table>`}
function system(v){return head('System','Identity, modes, authority and artifact roles')+`<div class="grid">${card('Application',v.application.id,'Schema '+v.application.schema_version,'wide')}${card('Strategy',v.active_strategy.id,'Frozen '+v.active_strategy.frozen,'wide')}${card('Holdout',v.holdout.id,'Ongoing '+v.holdout.ongoing)}${card('Repository',v.artifact_classification.canonical_repository)}${card('Runtime',v.artifact_classification.runtime_state)}${card('UI role',v.artifact_classification.ui,'','wide')}</div><div class="section"><div class="card full">${v.mode_ladder.map(m=>`<div class="mode"><b>${m.mode}</b><span>${esc(m.id)}</span>${[['CAP',m.capability_exists],['POL',m.policy_allows],['PRE',m.prerequisites_ready],['AUTH',m.execution_authorized],['ACTIVE',m.execution_active]].map(([a,x])=>`<span class="${x?'yes':'no'}">${a} ${x?'✓':'—'}</span>`).join('')}</div>`).join('')}</div></div>`}
const renders={overview,events,feed:eventFeed,shadow,strategy:strategyView,research,providers,system};async function load(){showNav();let r=route();app.innerHTML='<div class="card full">Loading…</div>';try{let v=await api(r.page==='feed'?'/api/app/radar':r.page==='events'&&r.id?'/api/app/events/'+encodeURIComponent(r.id):'/api/app/'+r.page);app.innerHTML=r.page==='events'&&r.id?detail(v):renders[r.page](v)}catch(e){app.innerHTML=`<div class="error">Fail-closed view error: ${esc(e.message)}</div>`}}
async function updateStatusBadges(){if(APP_CONFIG.radarOnly)return;let s=await api('/api/app/status');mode.textContent='MODE · '+s.current_operating_mode;strategy.textContent=s.active_strategy_id;ready.textContent=s.overall_readiness}window.addEventListener('hashchange',load);if(!APP_CONFIG.radarOnly&&route().page!=='feed')updateStatusBadges().catch(()=>{});load();
</script></body></html>
