function contextPanel(event){const ctx=event.context_geography;if(!ctx)return '';const institutions=event.institution_context||[];const label=language==='zh-TW';return `<section class="context-intelligence" data-context-contract="${esc(event.context_contract)}"><strong>${esc(t('contextGeo'))}: ${value(ctx.status==='MULTI_REGION'?t('multiRegion'):label?ctx.display_name_zh:ctx.display_name)}</strong><p class="context-method">${value(t(ctx.confidence))} · ${value(t(ctx.method))}</p><p class="context-geo">${value(label?ctx.reason_zh:ctx.reason)}</p><p>${esc(t('contextOnly'))}</p><p>${esc(t('eventGeoStrict'))}: ${value(event.event_geography?.status==='KNOWN'?t('verifiedLocation'):t('noLocation'))}</p>${institutions.map(i=>`<section class="institution-definition" data-institution-id="${esc(i.institution_id)}"><strong>${value(i.short_name)}</strong><span>${value(i.official_name)}</span><span lang="zh-TW">${value(i.official_name_zh)}</span><dl><dt>${esc(t('institutionType'))}</dt><dd>${value(label?i.institution_type_zh:i.institution_type)}</dd><dt>${esc(t('jurisdiction'))}</dt><dd>${value(label?i.jurisdiction_zh:i.jurisdiction)}</dd><dt>${esc(t('headquarters'))}</dt><dd>${value(label?i.headquarters_zh:i.headquarters)}</dd><dt>${esc(t('currency'))}</dt><dd>${value(i.relevant_currency)}</dd></dl>${sourceLink(i.reference_url,t('details'))}</section>`).join('')}${event.headline_explanation?.explanation_en?`<strong>${esc(t('whatThisMeans'))}</strong><p class="context-explanation">${value(label?event.headline_explanation.explanation_zh:event.headline_explanation.explanation_en)}</p>`:''}</section>`}

const replayStates=new Map();
const t=key=>STRINGS[language][key]||key;
const value=text=>esc(text==null||text===''?t('unknown'):text);
function stateLabel(state){return ({UNKNOWN:t('unknown'),AVAILABLE:t('available'),UNAVAILABLE:t('unavailable'),NOT_CONFIGURED:t('notConfigured'),STALE:t('stale'),FRESH:t('fresh')})[state]||value(state)}
function sourceLink(url,label){if(typeof url!=='string'||!url.trim())return t('notAvailable');try{const parsed=new URL(url);if(!['http:','https:'].includes(parsed.protocol))return t('notAvailable');return `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(label||url)}</a>`}catch{return t('notAvailable')}}
function translated(kind,id){if(!APP_CONFIG.demoMode||language!=='zh-TW')return null;const metadata=window.RADAR_DEMO_TRANSLATIONS;if(metadata?.presentation_only!==true)return null;return metadata[kind]?.[id]||null}
function linkedEvidence(event,view){const ids=new Set(event.official_evidence_ids||[]);return (view.official_evidence||[]).filter(e=>ids.has(e.official_evidence_id)&&e.canonical_event_id===event.event_id&&e.evidence_status==='OFFICIAL_CONFIRMED'&&typeof e.fact_proposition==='string'&&e.fact_proposition.trim())}

function officialPanel(records){return `<details class="official-panel" open><summary>${esc(t('official'))}</summary><p class="specific-only">${esc(t('specificOnly'))}</p>${records.map(e=>{const zh=translated('facts',e.official_evidence_id);return `<section class="official-record" data-evidence-status="${esc(e.evidence_status)}"><div>${statusBadge('confirmed')}</div><div class="state-code">OFFICIAL_CONFIRMED · ${esc(t('propositionOnly'))}</div><span class="field-label">${esc(t('authority'))}</span><strong>${value(e.authority_name)}</strong><span class="field-label">${esc(t('fact'))}${zh?' · '+esc(t('translation')):''}</span>${zh?`<p class="official-fact" data-presentation-only="true" lang="zh-TW">${esc(zh)}</p>`:''}<span class="field-label">${esc(t('originalEvidence'))}</span><p class="official-original" lang="en">${value(e.fact_proposition)}</p><span class="field-label">${esc(t('document'))}</span><div lang="en">${value(e.document_title)}</div><div class="event-meta">${esc(t('published'))}: <time>${value(e.published_at)}</time></div><div>${sourceLink(e.document_url,t('officialLink'))}</div><details class="provenance"><summary>${esc(t('details'))}</summary><p>${esc(t('evidenceRef'))}: ${value(e.official_evidence_id)}</p><p>${esc(t('reference'))}: ${value(e.document_reference)}</p><p>${esc(t('firstSeen'))}: ${value(e.first_seen_at)}</p><p>${esc(t('retrieved'))}: ${value(e.retrieved_at)}</p><p>${esc(t('linkStatus'))}: ${value(e.link_status)}</p></details></section>`}).join('')}</details>`}

let watchCategory='ALL',watchState='ALL';
function predictionMarketWatch(view){const watch=view.prediction_market_watch;if(!watch)return unlinkedExpectations(view);const stateNames={ACTIVE:'watchActive',CLOSED:'watchClosed',UNKNOWN:'watchUnknown'};const markets=watch.markets||[];const visible=markets.filter(m=>(watchCategory==='ALL'||m.category===watchCategory)&&(watchState==='ALL'||m.market_status===watchState));const categories=['ALL',...(watch.categories||[])];const states=['ALL',...['ACTIVE','CLOSED','UNKNOWN'].filter(s=>markets.some(m=>m.market_status===s))];const cards=visible.map(m=>`<article class="watch-card" data-market-id="${esc(m.market_id)}" data-watch-source="${esc(m.source_status)}"><div class="watch-badges"><span>${esc(t(m.category))}</span><span>${esc(t(stateNames[m.market_status]||'watchUnknown'))}</span><span>${esc(t(m.source_status))}</span></div><span class="translation-label">${esc(t('watchOriginal'))}</span><h3>${value(m.question)}</h3><div class="state-code">${esc(t('expectationOnly'))} · EXPECTATION_SENSOR · ${esc(t(m.outcome_type))}</div><span class="field-label">${esc(t('watchPrice'))}</span><ul class="watch-outcomes">${Array.isArray(m.outcomes)?m.outcomes.map((o,i)=>`<li><span>${value(o)}</span><strong>${expectationProbability(m.probabilities?.[i])}</strong></li>`).join(''):`<li>${value(null)}</li>`}</ul><div class="watch-updated"><span>${esc(t('watchObserved'))}: <time>${value(m.observed_at)}</time></span><span>${esc(t('watchUpdated'))}: <time>${value(m.provider_updated_at)}</time></span></div><p>${sourceLink(m.market_url,t('viewMarket'))}</p>${m.link_status==='LINKED'&&m.canonical_event_id?`<button type="button" data-map-event="${esc(m.canonical_event_id)}">${esc(t('watchRelated'))}</button>`:`<p class="watch-meta">${esc(t('watchNoLink'))}</p>`}<details><summary>${esc(t('watchDetails'))}</summary><p>${esc(t('watchGroup'))}: ${value(m.provider_event_ids?.join(' · ')||null)}</p><p>${esc(t('watchRelevance'))}: ${value(m.relevance_reason)}</p><p>${esc(t('watchOutcomeIds'))}: ${value(m.outcome_identifiers?.join(' · ')||null)}</p><p>${esc(t('watchLiquidity'))}: ${value(m.liquidity)} · ${esc(t('watchVolume'))}: ${value(m.volume)}</p><p>${value(m.proposition_metadata?.resolution_criteria||m.proposition_metadata?.description)}</p>${sourceLink(m.proposition_metadata?.resolution_source,t('source'))}</details></article>`).join('');return `<section id="prediction-market-watch" class="prediction-watch" aria-label="${esc(t('watchTitle'))}"><h2>${esc(t('watchTitle'))}</h2><p class="watch-disclosure">${esc(t('watchIntro'))}</p><p class="watch-meta">Polymarket · ${esc(t(watch.source_status))} · ${esc(t('watchCount'))}: ${value(watch.market_count)} <span class="state-code">${value(watch.provider?.reason)}</span></p><p class="watch-meta">${esc(t('guideLinkedMarkets'))}: ${markets.filter(m=>m.link_status==='LINKED'&&m.canonical_event_id).length} · ${esc(t('guideUnlinkedMarkets'))}: ${markets.filter(m=>m.link_status!=='LINKED'||!m.canonical_event_id).length}</p><div class="watch-filters" aria-label="${esc(t('watchTitle'))}">${categories.map(c=>`<button type="button" data-watch-category="${esc(c)}" aria-pressed="${c===watchCategory}">${esc(t(c==='ALL'?'allMacro':c))}</button>`).join('')}</div><div class="watch-filters">${states.map(s=>`<button type="button" data-watch-state="${esc(s)}" aria-pressed="${s===watchState}">${esc(t(s==='ALL'?'watchAllStates':stateNames[s]))}</button>`).join('')}</div><div class="watch-grid">${cards||`<p class="empty">${esc(t(watch.status==='UNAVAILABLE'?'watchUnavailable':markets.length?'watchNoFilter':'watchEmpty'))}</p>`}</div><p class="watch-disclosure">${esc(t('watchOutcomeNote'))}</p><p class="watch-disclosure">${esc(t('watchScope'))}</p></section>`}
function macroviewPanel(event,view){const preview=(view.macroview_previews||[]).find(p=>p.canonical_event_id===event.event_id&&p.preview_only===true&&p.persisted===false);if(!preview)return '';return `<details class="macroview-preview" data-macroview-id="${esc(preview.macroview_id)}"><summary>${esc(t('macroview'))}</summary><p>${esc(t('macroviewNote'))}</p><span class="field-label">${esc(t('facts'))}</span><strong>${esc(t(preview.fact_state))}</strong><ul>${(preview.snapshot?.official_evidence||[]).map(e=>`<li>${value(e.authority_name)}: ${value(e.fact_proposition)}</li>`).join('')}</ul><span class="field-label">${esc(t('expectations'))}</span><strong>${esc(t(preview.expectation_state))}</strong>${expectationRows(preview.snapshot?.market_expectations||[])}<p>${esc(t('marketDisclosure'))}</p><span class="field-label">${esc(t('unknowns'))}</span><ul>${(preview.unknowns||[]).map(key=>`<li>${esc(t(key))}</li>`).join('')}</ul><details class="provenance"><summary>${esc(t('details'))}</summary><p>${value(preview.macroview_id)}</p><p>${value(preview.provenance?.snapshot_sha256)}</p></details></details>`}
function replayResult(result){if(result.replay_status==='NO_OBSERVATIONS')return `<p>${esc(t('replayEmpty'))}</p>`;const groups=[['news_observations','replayNews'],['official_evidence_observations','replayOfficial'],['market_expectation_observations','replayMarkets']];const snapshot=result.reconstructed_macroview;const replayContext=snapshot?.snapshot?.event;return `<p class="state-code">${value(result.replay_status)} · ${value(result.as_of)}</p>${groups.map(([key,label])=>`<h4>${esc(t(label))}: ${(result[key]||[]).length}</h4><ol>${(result[key]||[]).map(row=>`<li><strong>${value(row.payload?.title||row.payload?.fact_proposition||row.payload?.question)}</strong><p>${esc(t('replayObserved'))}: <time>${value(row.observed_at)}</time> · ${esc(t(row.active_at_as_of?'replayActive':'replayHistory'))}</p>${row.observation_kind==='MARKET_EXPECTATION'?`<p>EXPECTATION_SENSOR · ${value(row.payload?.probabilities)}</p>`:''}</li>`).join('')}</ol>`).join('')}${snapshot?`<h4>${esc(t('replayMacro'))}</h4><p>${esc(t(snapshot.fact_state))} · ${esc(t(snapshot.expectation_state))}</p>`:''}${replayContext?marketRealityPanel({...replayContext,market_reality:snapshot.snapshot.market_reality}):''}${replayContext?.context_contract?contextPanel(replayContext):`<p>${esc(t('contextNotObserved'))}</p>`}<h4>${esc(t('unknowns'))}</h4><ul>${(result.unknowns||[]).map(code=>`<li>${esc(t(code))}</li>`).join('')}</ul>`}
function realityReplay(event){const state=replayStates.get(event.event_id);const inputId='replay-time-'+event.event_id;return `<details class="reality-replay" ${state?'open':''}><summary>${esc(t('realityReplay'))}</summary><p>${esc(t('replayNote'))}</p><p>${esc(t('guideReplay'))}</p><div class="replay-controls"><label for="${esc(inputId)}">${esc(t('replayAsOf'))}<input id="${esc(inputId)}" type="text" autocomplete="off" placeholder="YYYY-MM-DDTHH:mm:ssZ" value="${esc(state?.asOf||'')}"></label><button type="button" data-replay-request="${esc(event.event_id)}" ${state?.loading?'disabled':''}>${esc(t('replayLoad'))}</button></div><div class="replay-result" aria-live="polite" role="status">${state?.loading?esc(t('replayLoading')):state?.error?`${esc(t('replayUnavailable'))} ${value(state.error)}`:state?.result?replayResult(state.result):''}</div></details>`}
async function loadReplay(eventId){const previous=replayStates.get(eventId);if(previous?.loading)return;const input=document.getElementById('replay-time-'+eventId);const asOf=input?.value?.trim()||'';replayStates.set(eventId,{asOf,loading:true});render();try{const response=await fetch('/api/app/replay?event_id='+encodeURIComponent(eventId)+'&as_of='+encodeURIComponent(asOf));const result=await response.json();if(!response.ok)throw Error(result.error||'REPLAY_UNAVAILABLE');if(result.contract_version!=='POINT_IN_TIME_REPLAY_V0'||result.canonical_event_id!==eventId)throw Error('INVALID_REPLAY_RESPONSE');replayStates.set(eventId,{asOf,loading:false,result})}catch(error){replayStates.set(eventId,{asOf,loading:false,error:error.message})}render()}
function eventCard(event,view){const records=linkedEvidence(event,view),zh=translated('events',event.event_id);const main=`<div class="event-main">${statusBadge('unverified')}<div class="state-code">${value(event.verification_status)}</div>${zh?`<div class="translation-label">${esc(t('translation'))}</div><h3 data-presentation-only="true" lang="zh-TW">${esc(zh)}</h3><div class="translation-label">${esc(t('original'))}</div><p class="original-title compact-title" lang="en">${value(event.event_title)}</p>`:`${language==='zh-TW'?`<div class="translation-label">${esc(t('originalOnly'))}</div>`:''}<h3 class="compact-title" lang="en">${value(event.event_title)}</h3>`}<div class="event-meta">${esc(t('source'))}: <strong>${value((event.source_names||[]).join(' · '))}</strong></div><div class="event-meta">${esc(t('articles'))}: <strong>${value(event.article_count)}</strong></div><div class="times"><div><span>${esc(t('detected'))}</span><time>${value(event.first_detected_at)}</time></div><div><span>${esc(t('latest'))}</span><time>${value(event.latest_article_at)}</time></div></div><details class="provenance"><summary>${esc(t('details'))}</summary><p>${esc(t('eventRef'))}: ${value(event.event_id)}</p><p lang="en">${value(event.event_title)}</p><p>${esc(t('occurred'))}: ${value(event.event_occurred_at)}</p><p>${esc(t('groupRule'))}: ${value(event.grouping?.rule)}</p>${(event.article_references||[]).map(ref=>`<p>${sourceLink(ref,t('articleLink'))} · ${value(ref)}</p>`).join('')}</details>${records.length?'':`<p class="no-evidence">${esc(t('noEvidence'))}</p>`}${eventGeography(event)}${contextPanel(event)}${eventTimeline(event)}${expectationPanel(event,view)}${marketRealityPanel(event)}${macroviewPanel(event,view)}${realityReplay(event)}</div>`;return `<article id="event-${esc(event.event_id)}" tabindex="-1" class="event-card ${records.length?'has-evidence':''}" data-event-id="${esc(event.event_id)}" data-event-status="${esc(event.verification_status)}">${records.length?`<div class="event-layout">${main}<div class="connection" aria-hidden="true">→</div>${officialPanel(records)}</div>`:main}</article>`}
function stage(label,english,count,countLabel,explanation,index){return `<section class="flow-stage"><div class="flow-index">0${index}</div><h2>${esc(t(label))}</h2><div class="stage-english" lang="en">${esc(english)}</div><div class="count" data-count="${esc(countLabel)}">${value(count)}</div><div class="count-label">${esc(t(countLabel))}</div><p>${esc(t(explanation))}</p></section>`}
function articleCard(item){return `<article class="news-item" data-article-status="${esc(item.verification_status)}">${statusBadge('unverified')}<div class="state-code">${value(item.verification_status)}</div><h3 lang="en">${value(item.title)}</h3><div class="event-meta">${esc(t('source'))}: ${value(item.news_source?.name)} · ${sourceLink(item.news_source?.url,t('articleLink'))}</div><div class="event-meta">${esc(t('observed'))}: <time>${value(item.observed_at||item.discovered_at)}</time></div><div class="event-meta">${esc(t(item.reported_time_kind==='SOURCE_DATE_PROXY'?'proxy':'reported'))}: <time>${value(item.reported_at)}</time></div><details class="provenance"><summary>${esc(t('details'))}</summary><p>${esc(t('reference'))}: ${value(item.article_reference||item.discovery_record_id)}</p><p>${esc(t('occurred'))}: ${value(item.event_occurred_at)}</p></details></article>`}
function discoverySources(view){const states=view.discovery_sources;if(!states||typeof states!=='object'||Array.isArray(states))return '';const labels={DISABLED:'disabledSource',STARTING:'acquisitionStarting',LIVE:'acquisitionLive',SNAPSHOT_FALLBACK:'acquisitionFallback',LAST_VALID_FALLBACK:'acquisitionFallback',UNAVAILABLE:'acquisitionUnavailable'};return `<section class="discovery-sources" aria-label="${esc(t('liveSources'))}"><h2>${esc(t('liveSources'))}</h2><div class="discovery-source-grid">${Object.entries(states).map(([name,state])=>`<section class="discovery-source" data-discovery-source="${esc(name)}" data-acquisition-status="${esc(state.status)}"><h3>${esc(name)}</h3><p>${esc(t(state.enabled===true?'enabledSource':state.enabled===false?'disabledSource':'unknown'))} · <span class="discovery-state">${esc(t(labels[state.status]||'unknown'))}</span> <span class="state-code">${value(state.status)}</span></p><p>${esc(t('lastRefresh'))}: <time>${value(state.last_success_at)}</time></p><p>${esc(t('newsCount'))}: ${value(state.article_count)}</p></section>`).join('')}</div><p>${esc(t('sourceAcquisitionNote'))}</p></section>`}
function ingestionNotice(view){const live=view.live_ingestion;if(live?.enabled){const title=live.status==='LIVE'?t('liveTitle'):live.status==='STARTING'?t('starting'):t('fallback');return `<aside class="demo-notice" data-live-status="${esc(live.status)}"><strong>${esc(title)}</strong><p>${esc(t('liveInfo'))}</p><p>${esc(t('lastRefresh'))}: <time>${value(live.last_success_at)}</time></p><p>${esc(t('acquisition'))}</p><div>${esc(t('source'))}: ${sourceLink('https://www.eia.gov/todayinenergy/','U.S. Energy Information Administration')} · ${esc(t('endorsement'))}</div></aside>`}if(Object.values(view.discovery_sources||{}).some(state=>state.enabled===true))return `<aside class="demo-notice"><strong>${esc(t('multiNoticeTitle'))}</strong><p>${esc(t('multiNoticeText'))}</p><p>${esc(t('acquisition'))}</p></aside>`;return APP_CONFIG.demoMode?`<aside class="demo-notice" aria-label="${esc(t('demo'))}"><strong>${esc(t('demo'))}</strong><p>${esc(t('demoText'))}</p><div>${esc(t('source'))}: ${sourceLink('https://www.eia.gov/todayinenergy/','U.S. Energy Information Administration')} · ${esc(t('endorsement'))}</div></aside>`:''}
function productGuide(view){const previewCount=Array.isArray(view.macroview_previews)?view.macroview_previews.length:0;const realityAvailable=(view.events||[]).some(e=>['PARTIAL','COMPLETE'].includes(e.market_reality?.snapshot_status));return `<nav class="section-nav" aria-label="${esc(t('guideTitle'))}"><a href="#canonical-events">${esc(t('navEvents'))}</a><a href="#world-map">${esc(t('navMap'))}</a><a href="#prediction-market-watch">${esc(t('navWatch'))}</a><a href="#news-items">${esc(t('navNews'))}</a><a href="#source-health">${esc(t('navHealth'))}</a></nav><section class="product-guide" aria-label="${esc(t('guideTitle'))}"><h2>${esc(t('guideTitle'))}</h2><ul><li><strong>${esc(t('news'))}:</strong> ${esc(t('guideNews'))}</li><li><strong>${esc(t('official'))}:</strong> ${esc(t('guideOfficial'))}</li><li><strong>${esc(t('watchTitle'))}:</strong> ${esc(t('guideMarket'))}</li><li><strong>${esc(t('worldMap'))}:</strong> ${esc(t('guideMap'))}</li></ul><p>${esc(t('guideCapabilities'))}: ${previewCount} ${esc(t('macroview'))} · ${esc(t('guideReplay'))} ${esc(t('macroviewNote'))}</p><p>${esc(t(realityAvailable?'guideRealityAvailable':'guideRealityUnavailable'))}</p></section>`}
function dataHealth(view){return `<section class="data-health" aria-label="${esc(t('navHealth'))}"><span>${esc(t('latestObserved'))}: <strong>${value(view.latest_observed_data_at)}</strong></span><span>${esc(t('health'))}: <strong>${stateLabel(view.health_status)}</strong></span><p>${esc(t('guideObservedVsHealth'))}</p></section>`}
function eventFeed(view){const events=view.events||[];const officialIds=new Set(events.flatMap(e=>linkedEvidence(e,view).map(x=>x.official_evidence_id)));const ordered=[...events].sort((a,b)=>Number(linkedEvidence(b,view).length>0)-Number(linkedEvidence(a,view).length>0));return `<div class="radar-feed"><section class="hero"><div class="eyebrow">${esc(t('eyebrow'))}</div><h1>${esc(t('brand'))}</h1><p class="intro">${esc(t('intro'))}</p><div class="flow" aria-label="${esc(t('intro'))}">${stage('news','News Discovery',view.news_item_count??view.item_count,'newsCount','discover',1)}<div class="flow-arrow" aria-hidden="true"></div>${stage('events','Canonical Events',view.distinct_event_count,'eventCount','organize',2)}<div class="flow-arrow" aria-hidden="true"></div>${stage('official','Official Evidence',officialIds.size,'factCount','verify',3)}</div></section>${productGuide(view)}${ingestionNotice(view)}${dataHealth(view)}${discoverySources(view)}${worldMap(view)}<section class="legend" aria-label="${esc(t('official'))}"><div>${statusBadge('unverified')}<p>${esc(t('unverifiedMeaning'))}</p></div><div>${statusBadge('confirmed')}<p>${esc(t('confirmedMeaning'))}</p></div></section><div class="section-head"><div><h2>${esc(t('events'))}</h2><p>${esc(t('eventIntro'))}</p></div><button type="button" id="refresh">${esc(t('refresh'))}</button></div><p class="translation-note">${esc(t('translationNote'))}</p><p class="translation-note">${esc(t('sortNote'))}</p><section id="canonical-events" class="canonical-grid" data-canonical-count="${value(view.distinct_event_count)}">${ordered.map(e=>eventCard(e,view)).join('')||`<p class="empty">${esc(t('empty'))}</p>`}</section>${predictionMarketWatch(view)}<div class="context"><span>${esc(t('feed'))}: <strong>${stateLabel(view.status)}</strong></span><span>${esc(t('latestObserved'))}: <strong>${value(view.latest_observed_data_at)}</strong></span><span>${esc(t('health'))}: <strong>${stateLabel(view.health_status)}</strong></span></div><details id="news-items" class="support-details"><summary>${esc(t('newsDetails'))} · ${value(view.news_item_count??view.item_count)} ${esc(t('newsCount'))}</summary><p>${esc(t('newsIntro'))}</p><div class="article-list">${(view.items||[]).map(articleCard).join('')||`<p class="empty">${esc(t('empty'))}</p>`}</div></details><details id="source-health" class="support-details"><summary>${esc(t('sourceDetails'))}</summary><p>${esc(t('healthNote'))}</p><div class="availability">${Object.entries(view.sources||{}).map(([key,state])=>`<div><h3>${esc(t(key==='news'?'newsSource':key==='official'?'officialSource':key))}</h3>${stateLabel(state.status)}<p>${esc(t('lastSuccess'))}: ${value(state.last_success_at)}</p></div>`).join('')}</div></details><details class="provenance"><summary>${esc(t('grouping'))}</summary><p>${esc(t('groupNote'))}</p><p>${esc(t('unassigned'))}: ${value(view.unassigned_article_count)}</p></details><footer>${esc(t('footer'))}</footer></div>`}
function render(){document.documentElement.lang=language;document.title=t('brand');document.getElementById('brand').textContent=t('brand');document.querySelectorAll('[data-language]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.language===language)));const app=document.getElementById('app');window.RadarWorldMap?.unmount();app.setAttribute('aria-busy',String(requestPending));app.innerHTML=lastError?`<p class="error" role="alert">${esc(t('error'))}: ${esc(lastError)}</p>`:currentView?eventFeed(currentView):`<p role="status">${esc(t('load'))}</p>`;if(currentView&&!lastError)window.RadarWorldMap?.mount(app.querySelector?.('.world-map'),currentView,language,mapFilter)}
function setLanguage(next){if(!Object.hasOwn(STRINGS,next))return;language=next;try{localStorage.setItem('radar-language',language)}catch{}render()}
async function load(){if(requestPending)return;requestPending=true;lastError=null;render();try{const response=await fetch('/api/app/radar');const view=await response.json();if(!response.ok)throw Error(view.error||response.status);currentView=view}catch(error){lastError=error.message}finally{requestPending=false;render()}}
document.getElementById('language-control').addEventListener('click',event=>{const button=event.target.closest('[data-language]');if(button)setLanguage(button.dataset.language)});
document.addEventListener('radar-map-event',event=>{if(typeof event.detail?.eventId==='string')activateMapTarget({dataset:{mapEvent:event.detail.eventId}})});
document.getElementById('app').addEventListener('click',event=>{const navLink=event.target.closest('.section-nav a[href^="#"]');if(navLink){const section=document.getElementById(navLink.getAttribute('href').slice(1));if(section)section.scrollIntoView({block:'start',behavior:'auto'});return;}const watchFilter=event.target.closest('[data-watch-category],[data-watch-state]');if(watchFilter){if(watchFilter.dataset.watchCategory)watchCategory=watchFilter.dataset.watchCategory;if(watchFilter.dataset.watchState)watchState=watchFilter.dataset.watchState;const key=watchFilter.dataset.watchCategory?'data-watch-category':'data-watch-state';const val=watchFilter.dataset.watchCategory||watchFilter.dataset.watchState;render();document.querySelector('['+key+'="'+val+'"]').focus();return;}const filter=event.target.closest('[data-map-filter]');if(filter){mapFilter=filter.dataset.mapFilter;render();document.querySelector('[data-map-filter=\"'+mapFilter+'\"]').focus();return;}const replayTarget=event.target.closest('[data-replay-request]');if(replayTarget){loadReplay(replayTarget.dataset.replayRequest);return}const mapTarget=event.target.closest('[data-map-event],[data-map-list]');if(mapTarget){event.preventDefault();activateMapTarget(mapTarget);return}if(event.target.closest('#refresh'))load()});
load();
</script>
</body>
</html>
