<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Global Event Radar: discover news, organize events, inspect specific facts supported by official evidence.">
<title>Global Event Radar</title>
<style>
:root{color-scheme:dark;--bg:#09131c;--panel:#122330;--line:#2e4556;--text:#eef5f8;--muted:#b0c4d1;--amber:#ffcd78;--teal:#9de6d4;--focus:#86dfed}*{box-sizing:border-box}body{margin:0;color:var(--text);background:radial-gradient(ellipse at 75% 0,#153747,transparent 52%),var(--bg);font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}button,a,summary{-webkit-tap-highlight-color:transparent}a{color:#abe8e7;overflow-wrap:anywhere;text-underline-offset:4px}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:4px}button{border:1px solid var(--line);border-radius:8px;background:#172d3c;padding:8px 14px}button:hover{border-color:var(--teal)}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px max(24px,calc((100% - 1320px)/2));border-bottom:1px solid var(--line);background:#0b1824}.brand{font-weight:750;font-size:20px;letter-spacing:-.03em;text-decoration:none;color:var(--text)}.language-control{display:flex;gap:2px;border:1px solid var(--line);border-radius:10px;padding:3px;flex-shrink:0}.language-control button{border:0;background:transparent;padding:5px 12px}.language-control button[aria-pressed=true]{color:#0a2024;background:var(--teal);font-weight:700}main{max-width:1370px;margin:auto;padding:36px 24px 48px}.eyebrow{font-size:12px;color:var(--teal);letter-spacing:.08em}.hero h1{font-size:clamp(30px,4vw,52px);line-height:1.2;letter-spacing:-.04em;margin:12px 0 15px}.hero .intro{font-size:17px;max-width:790px;color:var(--muted);margin:0 0 28px}.flow{display:grid;grid-template-columns:minmax(0,1fr) 32px minmax(0,1fr) 32px minmax(0,1fr);align-items:center;gap:10px;margin-bottom:20px}.flow-stage{align-self:stretch;border:1px solid var(--line);border-radius:16px;padding:22px;background:linear-gradient(135deg,#1c3646,#10222f)}.flow-stage:last-child{border-color:#3f776e;background:linear-gradient(135deg,#173e3e,#102a30)}.flow-index{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.flow-stage h2{font-size:20px;margin:8px 0 0}.flow-stage .stage-english{font-size:12px;color:var(--muted)}.flow-stage .count{font-size:58px;line-height:1.15;font-weight:750;margin:14px 0 0}.count-label{font-size:13px;color:var(--muted)}.flow-stage p{font-size:14px;margin:16px 0 0;color:var(--muted)}.flow-arrow{text-align:center;color:var(--teal);font-size:26px}.flow-arrow:before{content:'→'}.demo-notice{font-size:12px;color:var(--muted);padding:12px 16px;border:1px solid var(--line);border-radius:10px;margin:20px 0}.demo-notice strong{color:var(--text);font-size:12px}.demo-notice p{margin:3px 0}.legend{display:grid;grid-template-columns:1fr 1fr;gap:20px;border-block:1px solid var(--line);padding:20px 0;margin:26px 0}.legend p{font-size:13px;color:var(--muted);margin:7px 0 0}.status{display:inline-flex;align-items:center;gap:7px;border:1px solid #826b3d;color:var(--amber);background:#352e20;border-radius:7px;font-size:12px;line-height:1.5;padding:5px 9px;font-weight:650;max-width:100%}.status:before{content:'';width:8px;height:8px;border-radius:50%;background:currentColor;flex-shrink:0}.status.confirmed{color:var(--teal);border-color:#407a6c;background:#163830}.state-code{font-size:11px;color:var(--muted);margin-top:4px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:18px;margin:28px 0 18px}.section-head h2{font-size:26px;margin:0}.section-head p{color:var(--muted);font-size:13px;margin:3px 0 0}.canonical-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.event-card{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:22px}.event-card.has-evidence{grid-column:1/-1;border-color:#508b82;background:linear-gradient(120deg,#132937,#10212d)}.event-layout{display:grid;grid-template-columns:minmax(0,1fr) 26px minmax(0,1fr);gap:20px;align-items:start}.connection{color:var(--teal);font-size:25px;margin-top:110px;text-align:center}.event-card h3{font-size:21px;line-height:1.4;letter-spacing:-.02em;margin:13px 0 8px;overflow-wrap:anywhere}.compact-title{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.original-title{font-size:13px;line-height:1.55;color:var(--muted);overflow-wrap:anywhere;margin:8px 0 14px}.translation-label{font-size:11px;color:var(--teal);margin:10px 0 0}.event-meta{font-size:13px;color:var(--muted);margin:7px 0;overflow-wrap:anywhere}.event-meta strong{font-weight:500;color:var(--text)}.times{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin:16px 0;font-size:12px}.times span{display:block;color:var(--muted)}time{overflow-wrap:anywhere;font-variant-numeric:tabular-nums}.no-evidence{font-size:13px;color:var(--muted);margin:17px 0 0}.provenance{font-size:12px;color:var(--muted);margin-top:16px}.provenance p{overflow-wrap:anywhere;white-space:pre-wrap}.provenance summary{font-size:13px}.official-panel{min-width:0;background:#133336;border:1px solid #427b73;border-radius:12px;padding:18px}.official-panel>summary{font-size:18px;font-weight:700;color:#d7f9ed}.official-panel .specific-only{color:#bbd8d4;font-size:13px;margin:6px 0 16px}.official-record+.official-record{border-top:1px solid #427b73;margin-top:18px;padding-top:18px}.official-fact{font-size:19px;line-height:1.5;margin:8px 0;overflow-wrap:anywhere}.official-original{font-size:14px;overflow-wrap:anywhere}.field-label{display:block;font-size:12px;color:#c1d9d4;margin-top:12px}.translation-note{font-size:12px;color:var(--muted);margin:16px 0}.context{display:flex;flex-wrap:wrap;gap:12px 26px;color:var(--muted);font-size:12px;margin:18px 0}.context strong{color:var(--text);font-weight:500}.support-details{margin:26px 0;border-top:1px solid var(--line);padding-top:18px;color:var(--muted)}summary{cursor:pointer;overflow-wrap:anywhere}summary:hover{color:var(--text)}.article-list{display:grid;gap:12px;margin:16px 0}.news-item{padding:18px;border:1px solid var(--line);border-radius:10px;min-width:0}.news-item h3{font-size:17px;color:var(--text);overflow-wrap:anywhere}.availability{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:16px 0}.availability div{border:1px solid var(--line);border-radius:8px;padding:14px;overflow-wrap:anywhere}.availability h3{font-size:14px;margin:0;color:var(--text)}.empty,.error{padding:22px;border:1px solid var(--line);border-radius:10px;color:var(--muted)}.error{border-color:#cd8d71;color:#ffd2b9}footer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:20px;margin-top:32px}
@media(min-width:1440px){main{padding-top:48px}.flow-stage{padding:28px}.flow-stage .count{font-size:68px}.event-card{padding:28px}}
@media(max-width:1100px){.event-layout{grid-template-columns:1fr;gap:14px}.connection{margin:0;transform:rotate(90deg)}.flow-stage{padding:18px}.flow-stage h2{font-size:18px}}
@media(max-width:650px){.top{padding:16px;gap:10px}.brand{font-size:17px}.language-control button{padding:5px 9px}main{padding:24px 16px}.hero .intro{font-size:15px}.flow{grid-template-columns:minmax(0,1fr);gap:8px}.flow-arrow:before{content:'↓'}.flow-stage{display:grid;grid-template-columns:minmax(0,1fr) 72px;gap:0 16px}.flow-stage .count{grid-column:2;grid-row:1/4;text-align:right;font-size:46px;align-self:center;margin:0}.flow-stage p,.count-label{grid-column:1/-1}.legend,.canonical-grid,.times,.availability{grid-template-columns:minmax(0,1fr)}.event-card{padding:18px}.event-card.has-evidence{grid-column:auto}.section-head h2{font-size:23px}.official-panel{padding:16px}.hero h1{font-size:32px}.language-control{font-size:13px}}
</style>
</head>
<body>
<header class="top"><a id="brand" class="brand" href="#/feed">Global Event Radar</a><nav class="language-control" id="language-control" aria-label="Language / 語言"><button type="button" data-language="zh-TW" lang="zh-TW" aria-pressed="false">中文</button><button type="button" data-language="en" lang="en" aria-pressed="false">EN</button></nav></header>
<main id="app" aria-busy="true"><p role="status">Loading / 載入中…</p></main>
<script src="/ui/radar_demo_translations.js"></script>
<script>
'use strict';
const APP_CONFIG=window.__MACRO_OS_CONFIG__||{};
const STRINGS={
en:{liveTitle:'CLOUD-UPDATED EIA FEED · READ ONLY',liveInfo:'Refreshes on startup and periodically while the service is active. Free hosting may sleep; this is not continuous monitoring.',lastRefresh:'Last successful refresh',fallback:'EIA refresh unavailable · showing validated snapshot or last valid feed',starting:'EIA refresh starting · showing validated snapshot',acquisition:'Acquisition status only; source health is separate.',originalOnly:'Original',brand:'Global Event Radar',eyebrow:'GLOBAL EVENT INTELLIGENCE',intro:'News tells us what may matter. We organize reports into events. Official documents confirm only specific supported facts.',news:'News Discovery',events:'Canonical Events',official:'Official Evidence',newsCount:'News Articles',eventCount:'Canonical Events',factCount:'Confirmed Propositions',discover:'Find reports worth following',organize:'Organize discovery into conservative event groups',verify:'Inspect specific facts supported by official documents',demo:'PUBLIC DEMO · READ-ONLY SNAPSHOT',demoText:'This demonstration uses a fixed validated dataset. Automated live ingestion is not enabled in this deployment.',source:'Source',endorsement:'No EIA endorsement.',unverified:'UNVERIFIED NEWS',confirmed:'OFFICIAL CONFIRMED — proposition only',unverifiedMeaning:'News discovery is not official fact confirmation.',confirmedMeaning:'The document supports this specific proposition, not every claim in the news or event.',eventIntro:'Follow the discovery. Inspect the evidence. The event itself remains unverified.',refresh:'Refresh view',translation:'Chinese translation',translationNote:'Chinese translation is for readability only; the original source text is the evidence of record. These are not official EIA translations.',original:'Original English',details:'Details',eventRef:'Event reference',evidenceRef:'Evidence reference',articles:'Articles',sources:'Sources',detected:'First detected',latest:'Latest article / source time',occurred:'Event occurrence',unknown:'Unknown',notAvailable:'Not available',noEvidence:'○ Awaiting official evidence',specificOnly:'This document supports only the specific proposition below.',authority:'Authority',fact:'Fact confirmed',originalEvidence:'Original evidence',document:'Document',published:'Published',officialLink:'View original official document',reference:'Reference',firstSeen:'Evidence first seen',retrieved:'Retrieved',articleLink:'Original article',observed:'Observed by collector',reported:'Reported / source time',proxy:'Source date (proxy)',newsDetails:'News Discovery — Unverified',newsIntro:'Original reports remain discovery evidence, not verified facts.',health:'Source health',latestObserved:'Latest observed data',feed:'Feed',sourceDetails:'Source availability & freshness',healthNote:'Article timestamps are not collector health. Health stays Unknown without per-source health evidence.',lastSuccess:'Last successful update',empty:'No records available.',grouping:'Grouping & identity notes',groupNote:'Conservative V0 grouping: articles stay separate without sufficient merge evidence. IDs may change when membership changes.',unassigned:'Unassigned articles',sortNote:'Display only: the event with linked evidence is shown first. Source chronology is unchanged.',footer:'Read-only event intelligence · No predictions or trading recommendations.',load:'Loading…',error:'Unable to load the read-only feed',newsSource:'News',officialSource:'Official',macroview:'MacroView',polymarket:'Polymarket',source_health:'Source health',available:'Available',unavailable:'Unavailable',notConfigured:'Not configured',stale:'Stale',fresh:'Fresh',groupRule:'Grouping rule',linkStatus:'Evidence link status'},
'zh-TW':{liveTitle:'雲端自動更新 EIA 資料 · 唯讀',liveInfo:'服務啟動時與運作期間定期更新。免費託管可能休眠，不保證持續監測。',lastRefresh:'最後成功更新',fallback:'EIA 更新暫時不可用 · 目前顯示已驗證快照或最近有效資料',starting:'EIA 更新啟動中 · 目前顯示已驗證快照',acquisition:'僅表示資料取得狀態，並非來源健康證據。',originalOnly:'原文 / Original',brand:'全球事件雷達',eyebrow:'全球事件情報',intro:'新聞告訴我們什麼可能值得注意。系統將報導整理成事件，官方文件只確認其中可被證明的具體事實。',news:'新聞發現',events:'事件整理',official:'官方證據',newsCount:'新聞篇數',eventCount:'整理事件數',factCount:'已確認命題',discover:'發現值得持續關注的新聞',organize:'保守整理報導，形成事件群組',verify:'查看官方文件支持的具體事實',demo:'公開展示 · 唯讀快照',demoText:'此展示使用固定且已驗證的資料快照。此公開版本尚未啟用自動即時資料蒐集。',source:'來源',endorsement:'本展示未獲 EIA 背書。',unverified:'未驗證新聞',confirmed:'官方命題已確認',unverifiedMeaning:'來自新聞來源，尚不是官方事實確認。',confirmedMeaning:'官方文件支持這一項具體事實，不代表整則新聞或事件都被確認。',eventIntro:'追蹤新聞發現，查看證據支持的命題。事件本身仍維持未驗證。',refresh:'重新讀取',translation:'中文摘要',translationNote:'中文翻譯僅供閱讀，原始英文為證據依據。這些並非 EIA 官方翻譯。',original:'原始英文',details:'詳細資料',eventRef:'事件識別碼',evidenceRef:'證據識別碼',articles:'新聞篇數',sources:'新聞來源',detected:'首次發現',latest:'最新報導／來源時間',occurred:'事件發生時間',unknown:'未知',notAvailable:'無法取得',noEvidence:'○ 尚無官方證據',specificOnly:'此文件僅支持下列具體命題。',authority:'發布機關',fact:'已確認事實',originalEvidence:'原始證據',document:'文件標題',published:'發布時間',officialLink:'查看官方文件',reference:'來源參照',firstSeen:'首次取得證據',retrieved:'擷取時間',articleLink:'查看新聞原文',observed:'蒐集器觀察時間',reported:'報導／來源時間',proxy:'來源日期（代理時間）',newsDetails:'新聞發現 — 未驗證',newsIntro:'原始報導與來源連結僅供新聞發現，並非已確認事實。',health:'來源健康狀態',latestObserved:'最新資料觀察時間',feed:'資料狀態',sourceDetails:'來源可用性與新鮮度',healthNote:'報導時間不等於蒐集器健康狀態。缺少各來源健康證據時，維持未知。',lastSuccess:'最近成功更新',empty:'目前沒有可顯示的資料。',grouping:'分組與識別說明',groupNote:'V0 採保守分組：合併證據不足時，各篇新聞維持獨立。群組成員改變時，識別碼可能改變。',unassigned:'未分組新聞',sortNote:'僅調整顯示順序：具有官方證據的事件優先呈現，來源時間順序未改動。',footer:'唯讀事件情報 · 不提供預測或交易建議。',load:'載入中…',error:'無法載入唯讀新聞',newsSource:'新聞',officialSource:'官方',macroview:'MacroView',polymarket:'Polymarket',source_health:'來源健康狀態',available:'可用',unavailable:'無法取得',notConfigured:'尚未設定',stale:'資料過期',fresh:'資料新鮮',groupRule:'分組規則',linkStatus:'證據連結狀態'}
};
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function initialLanguage(){try{const saved=localStorage.getItem('radar-language');if(saved==='zh-TW'||saved==='en')return saved}catch{}return String(navigator.language||'en').toLowerCase().startsWith('zh')?'zh-TW':'en'}
let language=initialLanguage(),currentView=null,lastError=null,requestPending=false;
const t=key=>STRINGS[language][key]||key;
const value=text=>esc(text==null||text===''?t('unknown'):text);
function stateLabel(state){return ({UNKNOWN:t('unknown'),AVAILABLE:t('available'),UNAVAILABLE:t('unavailable'),NOT_CONFIGURED:t('notConfigured'),STALE:t('stale'),FRESH:t('fresh')})[state]||value(state)}
function sourceLink(url,label){if(typeof url!=='string'||!url.trim())return t('notAvailable');try{const parsed=new URL(url);if(!['http:','https:'].includes(parsed.protocol))return t('notAvailable');return `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(label||url)}</a>`}catch{return t('notAvailable')}}
function translated(kind,id){if(!APP_CONFIG.demoMode||language!=='zh-TW')return null;const metadata=window.RADAR_DEMO_TRANSLATIONS;if(metadata?.presentation_only!==true)return null;return metadata[kind]?.[id]||null}
function linkedEvidence(event,view){const ids=new Set(event.official_evidence_ids||[]);return (view.official_evidence||[]).filter(e=>ids.has(e.official_evidence_id)&&e.canonical_event_id===event.event_id&&e.evidence_status==='OFFICIAL_CONFIRMED'&&typeof e.fact_proposition==='string'&&e.fact_proposition.trim())}
function statusBadge(kind){return `<span class="status ${kind==='confirmed'?'confirmed':''}">${esc(t(kind))}</span>`}
function officialPanel(records){return `<details class="official-panel" open><summary>${esc(t('official'))}</summary><p class="specific-only">${esc(t('specificOnly'))}</p>${records.map(e=>{const zh=translated('facts',e.official_evidence_id);return `<section class="official-record" data-evidence-status="${esc(e.evidence_status)}"><div>${statusBadge('confirmed')}</div><div class="state-code">OFFICIAL_CONFIRMED · proposition only</div><span class="field-label">${esc(t('authority'))}</span><strong>${value(e.authority_name)}</strong><span class="field-label">${esc(t('fact'))}${zh?' · '+esc(t('translation')):''}</span>${zh?`<p class="official-fact" data-presentation-only="true" lang="zh-TW">${esc(zh)}</p>`:''}<span class="field-label">${esc(t('originalEvidence'))}</span><p class="official-original" lang="en">${value(e.fact_proposition)}</p><span class="field-label">${esc(t('document'))}</span><div lang="en">${value(e.document_title)}</div><div class="event-meta">${esc(t('published'))}: <time>${value(e.published_at)}</time></div><div>${sourceLink(e.document_url,t('officialLink'))}</div><details class="provenance"><summary>${esc(t('details'))}</summary><p>${esc(t('evidenceRef'))}: ${value(e.official_evidence_id)}</p><p>${esc(t('reference'))}: ${value(e.document_reference)}</p><p>${esc(t('firstSeen'))}: ${value(e.first_seen_at)}</p><p>${esc(t('retrieved'))}: ${value(e.retrieved_at)}</p><p>${esc(t('linkStatus'))}: ${value(e.link_status)}</p></details></section>`}).join('')}</details>`}
function eventCard(event,view){const records=linkedEvidence(event,view),zh=translated('events',event.event_id);const main=`<div class="event-main">${statusBadge('unverified')}<div class="state-code">${value(event.verification_status)}</div>${zh?`<div class="translation-label">${esc(t('translation'))}</div><h3 data-presentation-only="true" lang="zh-TW">${esc(zh)}</h3><div class="translation-label">${esc(t('original'))}</div><p class="original-title compact-title" lang="en">${value(event.event_title)}</p>`:`${language==='zh-TW'?`<div class="translation-label">${esc(t('originalOnly'))}</div>`:''}<h3 class="compact-title" lang="en">${value(event.event_title)}</h3>`}<div class="event-meta">${esc(t('source'))}: <strong>${value((event.source_names||[]).join(' · '))}</strong></div><div class="event-meta">${esc(t('articles'))}: <strong>${value(event.article_count)}</strong></div><div class="times"><div><span>${esc(t('detected'))}</span><time>${value(event.first_detected_at)}</time></div><div><span>${esc(t('latest'))}</span><time>${value(event.latest_article_at)}</time></div></div><details class="provenance"><summary>${esc(t('details'))}</summary><p>${esc(t('eventRef'))}: ${value(event.event_id)}</p><p lang="en">${value(event.event_title)}</p><p>${esc(t('occurred'))}: ${value(event.event_occurred_at)}</p><p>${esc(t('groupRule'))}: ${value(event.grouping?.rule)}</p>${(event.article_references||[]).map(ref=>`<p>${sourceLink(ref,t('articleLink'))} · ${value(ref)}</p>`).join('')}</details>${records.length?'':`<p class="no-evidence">${esc(t('noEvidence'))}</p>`}</div>`;return `<article class="event-card ${records.length?'has-evidence':''}" data-event-id="${esc(event.event_id)}" data-event-status="${esc(event.verification_status)}">${records.length?`<div class="event-layout">${main}<div class="connection" aria-hidden="true">→</div>${officialPanel(records)}</div>`:main}</article>`}
function stage(label,english,count,countLabel,explanation,index){return `<section class="flow-stage"><div class="flow-index">0${index}</div><h2>${esc(t(label))}</h2><div class="stage-english" lang="en">${esc(english)}</div><div class="count" data-count="${esc(countLabel)}">${value(count)}</div><div class="count-label">${esc(t(countLabel))}</div><p>${esc(t(explanation))}</p></section>`}
function articleCard(item){return `<article class="news-item" data-article-status="${esc(item.verification_status)}">${statusBadge('unverified')}<div class="state-code">${value(item.verification_status)}</div><h3 lang="en">${value(item.title)}</h3><div class="event-meta">${esc(t('source'))}: ${value(item.news_source?.name)} · ${sourceLink(item.news_source?.url,t('articleLink'))}</div><div class="event-meta">${esc(t('observed'))}: <time>${value(item.observed_at||item.discovered_at)}</time></div><div class="event-meta">${esc(t(item.reported_time_kind==='SOURCE_DATE_PROXY'?'proxy':'reported'))}: <time>${value(item.reported_at)}</time></div><details class="provenance"><summary>${esc(t('details'))}</summary><p>${esc(t('reference'))}: ${value(item.article_reference||item.discovery_record_id)}</p><p>${esc(t('occurred'))}: ${value(item.event_occurred_at)}</p></details></article>`}
function ingestionNotice(view){const live=view.live_ingestion;if(live?.enabled){const title=live.status==='LIVE'?t('liveTitle'):live.status==='STARTING'?t('starting'):t('fallback');return `<aside class="demo-notice" data-live-status="${esc(live.status)}"><strong>${esc(title)}</strong><p>${esc(t('liveInfo'))}</p><p>${esc(t('lastRefresh'))}: <time>${value(live.last_success_at)}</time></p><p>${esc(t('acquisition'))}</p><div>${esc(t('source'))}: ${sourceLink('https://www.eia.gov/todayinenergy/','U.S. Energy Information Administration')} · ${esc(t('endorsement'))}</div></aside>`}return APP_CONFIG.demoMode?`<aside class="demo-notice" aria-label="${esc(t('demo'))}"><strong>${esc(t('demo'))}</strong><p>${esc(t('demoText'))}</p><div>${esc(t('source'))}: ${sourceLink('https://www.eia.gov/todayinenergy/','U.S. Energy Information Administration')} · ${esc(t('endorsement'))}</div></aside>`:''}
function eventFeed(view){const events=view.events||[];const officialIds=new Set(events.flatMap(e=>linkedEvidence(e,view).map(x=>x.official_evidence_id)));const ordered=[...events].sort((a,b)=>Number(linkedEvidence(b,view).length>0)-Number(linkedEvidence(a,view).length>0));return `<div class="radar-feed"><section class="hero"><div class="eyebrow">${esc(t('eyebrow'))}</div><h1>${esc(t('brand'))}</h1><p class="intro">${esc(t('intro'))}</p><div class="flow" aria-label="${esc(t('intro'))}">${stage('news','News Discovery',view.news_item_count??view.item_count,'newsCount','discover',1)}<div class="flow-arrow" aria-hidden="true"></div>${stage('events','Canonical Events',view.distinct_event_count,'eventCount','organize',2)}<div class="flow-arrow" aria-hidden="true"></div>${stage('official','Official Evidence',officialIds.size,'factCount','verify',3)}</div></section>${ingestionNotice(view)}<section class="legend" aria-label="${esc(t('official'))}"><div>${statusBadge('unverified')}<p>${esc(t('unverifiedMeaning'))}</p></div><div>${statusBadge('confirmed')}<p>${esc(t('confirmedMeaning'))}</p></div></section><div class="section-head"><div><h2>${esc(t('events'))}</h2><p>${esc(t('eventIntro'))}</p></div><button type="button" id="refresh">${esc(t('refresh'))}</button></div><p class="translation-note">${esc(t('translationNote'))}</p><p class="translation-note">${esc(t('sortNote'))}</p><section class="canonical-grid" data-canonical-count="${value(view.distinct_event_count)}">${ordered.map(e=>eventCard(e,view)).join('')||`<p class="empty">${esc(t('empty'))}</p>`}</section><div class="context"><span>${esc(t('feed'))}: <strong>${stateLabel(view.status)}</strong></span><span>${esc(t('latestObserved'))}: <strong>${value(view.latest_observed_data_at)}</strong></span><span>${esc(t('health'))}: <strong>${stateLabel(view.health_status)}</strong></span></div><details class="support-details"><summary>${esc(t('newsDetails'))} · ${value(view.news_item_count??view.item_count)} ${esc(t('newsCount'))}</summary><p>${esc(t('newsIntro'))}</p><div class="article-list">${(view.items||[]).map(articleCard).join('')||`<p class="empty">${esc(t('empty'))}</p>`}</div></details><details class="support-details"><summary>${esc(t('sourceDetails'))}</summary><p>${esc(t('healthNote'))}</p><div class="availability">${Object.entries(view.sources||{}).map(([key,state])=>`<div><h3>${esc(t(key==='news'?'newsSource':key==='official'?'officialSource':key))}</h3>${stateLabel(state.status)}<p>${esc(t('lastSuccess'))}: ${value(state.last_success_at)}</p></div>`).join('')}</div></details><details class="provenance"><summary>${esc(t('grouping'))}</summary><p>${esc(t('groupNote'))}</p><p>${esc(t('unassigned'))}: ${value(view.unassigned_article_count)}</p></details><footer>${esc(t('footer'))}</footer></div>`}
function render(){document.documentElement.lang=language;document.title=t('brand');document.getElementById('brand').textContent=t('brand');document.querySelectorAll('[data-language]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.language===language)));const app=document.getElementById('app');app.setAttribute('aria-busy',String(requestPending));app.innerHTML=lastError?`<p class="error" role="alert">${esc(t('error'))}: ${esc(lastError)}</p>`:currentView?eventFeed(currentView):`<p role="status">${esc(t('load'))}</p>`}
function setLanguage(next){if(!Object.hasOwn(STRINGS,next))return;language=next;try{localStorage.setItem('radar-language',language)}catch{}render()}
async function load(){if(requestPending)return;requestPending=true;lastError=null;render();try{const response=await fetch('/api/app/radar');const view=await response.json();if(!response.ok)throw Error(view.error||response.status);currentView=view}catch(error){lastError=error.message}finally{requestPending=false;render()}}
document.getElementById('language-control').addEventListener('click',event=>{const button=event.target.closest('[data-language]');if(button)setLanguage(button.dataset.language)});
document.getElementById('app').addEventListener('click',event=>{if(event.target.closest('#refresh'))load()});
load();
</script>
</body>
</html>
