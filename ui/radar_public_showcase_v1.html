<style>

const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function initialLanguage(){try{const saved=localStorage.getItem('radar-language');if(saved==='zh-TW'||saved==='en')return saved}catch{}return String(navigator.language||'en').toLowerCase().startsWith('zh')?'zh-TW':'en'}
let language=initialLanguage(),currentView=null,lastError=null,requestPending=false;
const t=key=>STRINGS[language][key]||key;
const value=text=>esc(text==null||text===''?t('unknown'):text);
function stateLabel(state){return ({UNKNOWN:t('unknown'),AVAILABLE:t('available'),UNAVAILABLE:t('unavailable'),NOT_CONFIGURED:t('notConfigured'),STALE:t('stale'),FRESH:t('fresh')})[state]||value(state)}
function sourceLink(url,label){if(typeof url!=='string'||!url.trim())return t('notAvailable');try{const parsed=new URL(url);if(!['http:','https:'].includes(parsed.protocol))return t('notAvailable');return `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(label||url)}</a>`}catch{return t('notAvailable')}}
function translated(kind,id){if(!APP_CONFIG.demoMode||language!=='zh-TW')return null;const metadata=window.RADAR_DEMO_TRANSLATIONS;if(metadata?.presentation_only!==true)return null;return metadata[kind]?.[id]||null}
function linkedEvidence(event,view){const ids=new Set(event.official_evidence_ids||[]);return (view.official_evidence||[]).filter(e=>ids.has(e.official_evidence_id)&&e.canonical_event_id===event.event_id&&e.evidence_status==='OFFICIAL_CONFIRMED'&&typeof e.fact_proposition==='string'&&e.fact_proposition.trim())}
function statusBadge(kind){return `<span class="status ${kind==='confirmed'?'confirmed':''}">${esc(t(kind))}</span>`}
function officialPanel(records){return `<details class="official-panel" open><summary>${esc(t('official'))}</summary><p class="specific-only">${esc(t('specificOnly'))}</p>${records.map(e=>{const zh=translated('facts',e.official_evidence_id);return `<section class="official-record" data-evidence-status="${esc(e.evidence_status)}"><div>${statusBadge('confirmed')}</div><div class="state-code">OFFICIAL_CONFIRMED · proposition only</div><span class="field-label">${esc(t('authority'))}</span><strong>${value(e.authority_name)}</strong><span class="field-label">${esc(t('fact'))}${zh?' · '+esc(t('translation')):''}</span>${zh?`<p class="official-fact" data-presentation-only="true" lang="zh-TW">${esc(zh)}</p>`:''}<span class="field-label">${esc(t('originalEvidence'))}</span><p class="official-original" lang="en">${value(e.fact_proposition)}</p><span class="field-label">${esc(t('document'))}</span><div lang="en">${value(e.document_title)}</div><div class="event-meta">${esc(t('published'))}: <time>${value(e.published_at)}</time></div><div>${sourceLink(e.document_url,t('officialLink'))}</div><details class="provenance"><summary>${esc(t('details'))}</summary><p>${esc(t('evidenceRef'))}: ${value(e.official_evidence_id)}</p><p>${esc(t('reference'))}: ${value(e.document_reference)}</p><p>${esc(t('firstSeen'))}: ${value(e.first_seen_at)}</p><p>${esc(t('retrieved'))}: ${value(e.retrieved_at)}</p><p>${esc(t('linkStatus'))}: ${value(e.link_status)}</p></details></section>`}).join('')}</details>`}
function timelineTime(iso){if(typeof iso!=='string'||!iso.trim()||!/(?:Z|[+-]\d{2}:\d{2})$/.test(iso))return esc(t('unknownTime'));const date=new Date(iso);if(!Number.isFinite(date.getTime()))return esc(t('unknownTime'));const formatted=new Intl.DateTimeFormat(language,{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',timeZone:'UTC',hour12:false}).format(date);return `<time datetime="${esc(iso)}" title="${esc(iso)}">${esc(formatted)} UTC</time>`}
function timelineEntry(entry,event){const official=entry.entry_type==='OFFICIAL_EVIDENCE';const role={REPORTED_AT:'timelineReported',OBSERVED_AT:'timelineDetected',EVIDENCE_PUBLISHED_AT:'evidencePublished',EVIDENCE_FIRST_SEEN_AT:'evidenceObserved',EVIDENCE_RETRIEVED_AT:'evidenceRetrieved',UNKNOWN:'unknownTime'}[entry.timestamp_role]||'unknownTime';const translatedTitle=official?translated('facts',entry.official_evidence_id):(event.article_count===1&&entry.title===event.event_title?translated('events',event.event_id):null);return `<li class="timeline-entry ${official?'official':'news'}" data-timeline-type="${esc(entry.entry_type)}" data-timestamp-role="${esc(entry.timestamp_role)}" data-timeline-id="${esc(entry.timeline_entry_id)}"><div class="entry-heading">${esc(t(official?'official':'newsDiscovered'))}</div><p>${esc(t(role))}: ${timelineTime(entry.timestamp)}</p>${translatedTitle?`<div class="translation-label">${esc(t('translation'))}</div><h4 data-timeline-presentation-only="true" lang="zh-TW">${esc(translatedTitle)}</h4>`:''}<h4 class="${translatedTitle?'original-entry':''}" lang="en">${value(entry.title)}</h4><p>${esc(t('source'))}: ${value(entry.source_name)}</p>${official?`<p>${esc(t('published'))}: ${entry.published_at?timelineTime(entry.published_at):value(null)}</p><p>${esc(t('specificOnly'))}</p>`:`<p>${esc(t('timelineDetected'))}: ${timelineTime(entry.observed_at)}</p>`}<p>${sourceLink(entry.source_url,t(official?'officialLink':'articleLink'))}</p><div class="state-code">${esc(entry.status)}${official?' · proposition only':''}</div></li>`}
function eventTimeline(event){const entries=Array.isArray(event.timeline)?event.timeline:[];const known=entries.filter(e=>e.timestamp!==null),unknown=entries.filter(e=>e.timestamp===null);const summary=event.status_summary||{};const news=entries.filter(e=>e.entry_type==='NEWS_DISCOVERED').length,official=entries.filter(e=>e.entry_type==='OFFICIAL_EVIDENCE').length;return `<details class="event-timeline" ${official?'open':''}><summary>${esc(t('viewTimeline'))} · ${esc(t('timeline'))}</summary><div class="timeline-summary"><span>${entries.length} ${esc(t('timelineEntries'))}</span><span>${news} ${esc(t('newsReports'))}</span><span>${official} ${esc(t('evidenceItems'))}</span></div><p class="timeline-note">${esc(t('timelineNote'))}</p>${known.length?`<ol class="timeline-list">${known.map(e=>timelineEntry(e,event)).join('')}</ol>`:''}${unknown.length?`<section class="timeline-unknown"><h4>${esc(t('unknownTime'))}</h4><ol class="timeline-list">${unknown.map(e=>timelineEntry(e,event)).join('')}</ol></section>`:''}${entries.length?'':`<p class="timeline-note">${esc(t('timelineEmpty'))}</p>`}<aside class="timeline-current"><strong>${esc(t('currentState'))}</strong><div class="state-code">${value(summary.verification_status||event.verification_status)}</div><p>${esc(t('brandTimeline'))}</p><p>${news} ${esc(t('newsReports'))} · ${official} ${esc(t('evidenceItems'))}</p>${official?'':`<p>${esc(t('noEvidence'))}</p>`}</aside></details>`}
function mapPoints(event){return event.geography_status==='KNOWN'&&Array.isArray(event.geography)?event.geography.filter(point=>point&&typeof point.geography_id==='string'&&point.evidence_type==='CURATED_PRESENTATION'&&typeof point.place_name==='string'&&typeof point.latitude==='number'&&typeof point.longitude==='number'&&Number.isFinite(point.latitude)&&Number.isFinite(point.longitude)&&point.latitude>=-90&&point.latitude<=90&&point.longitude>=-180&&point.longitude<=180):[]}
function eventGeography(event){const points=mapPoints(event);return `<section class="event-geography" data-geography-status="${points.length?'KNOWN':'UNKNOWN'}"><strong>${esc(t('geography'))}</strong>: ${points.length?points.map(point=>`<div class="geo-point">${esc(point.place_name)}${point.country_code?' · '+esc(point.country_code):''}<div>${esc(t('presentationGeography'))}</div><details class="provenance"><summary>${esc(t('geographyReference'))}</summary><p>${sourceLink(point.evidence_reference)}</p><p>${value(point.latitude)}, ${value(point.longitude)}</p></details></div>`).join(''):esc(t('noLocation'))}</section>`}
function worldMap(view){const events=Array.isArray(view.events)?view.events:[];const groups=new Map(),mapped=new Set();for(const event of events){for(const point of mapPoints(event)){mapped.add(event.event_id);const key=JSON.stringify([point.latitude,point.longitude]);if(!groups.has(key))groups.set(key,{latitude:point.latitude,longitude:point.longitude,members:[]});const group=groups.get(key);if(!group.members.some(member=>member.event.event_id===event.event_id&&member.point.geography_id===point.geography_id))group.members.push({event,point})}}const locations=[...groups.values()].sort((a,b)=>a.latitude-b.latitude||a.longitude-b.longitude);const grid=[-120,-60,0,60,120].map(lon=>`<line class="map-grid" x1="${(lon+180)*2}" x2="${(lon+180)*2}" y1="0" y2="360"/>`).join('')+[-60,-30,0,30,60].map(lat=>`<line class="${lat===0?'map-equator':'map-grid'}" x1="0" x2="720" y1="${(90-lat)*2}" y2="${(90-lat)*2}"/>`).join('');const locationId=group=>'map-location-'+String(group.latitude).replace('.','_')+'-'+String(group.longitude).replace('.','_');const pins=locations.map(group=>{const members=group.members,ids=new Set(members.map(m=>m.event.event_id)),first=members[0],id=locationId(group),single=ids.size===1,attrs=single?`data-map-event="${esc(first.event.event_id)}" href="#event-${esc(first.event.event_id)}"`:`data-map-list="${esc(id)}" href="#${esc(id)}"`;const label=members.map(m=>m.event.event_title+' · '+m.point.place_name+' · '+m.event.verification_status).join(' / ');return `<a class="map-marker" tabindex="0" ${attrs} aria-label="${esc(t('viewEvent')+' · '+label)}"><title>${esc(label)}</title><circle cx="${(group.longitude+180)*2}" cy="${(90-group.latitude)*2}" r="10"/>${ids.size>1?`<text x="${(group.longitude+180)*2}" y="${(90-group.latitude)*2+4}">${ids.size}</text>`:''}</a>`}).join('');const list=locations.map(group=>`<li id="${esc(locationId(group))}" class="map-location-group" tabindex="-1"><strong>${esc([...new Set(group.members.map(m=>m.point.place_name))].join(' · '))}</strong><ul>${group.members.map(({event,point})=>`<li><button type="button" data-map-event="${esc(event.event_id)}">${esc(t('viewEvent'))} — ${esc(translated('events',event.event_id)||event.event_title||t('unknown'))}</button><div>${esc(point.place_name)} · ${esc(t('presentationGeography'))} · ${esc(event.verification_status)}</div></li>`).join('')}</ul></li>`).join('');return `<section class="world-map" aria-label="${esc(t('worldMap'))}"><div class="map-heading"><h2>${esc(t('worldMap'))}</h2><div class="map-counts"><span>${esc(t('mappedEvents'))}: <strong data-mapped-count>${mapped.size}</strong></span><span>${esc(t('locationUnknown'))}: <strong data-unmapped-count>${events.length-mapped.size}</strong></span></div></div><p>${esc(t('mapDisclosure'))}</p><svg viewBox="0 0 720 360" role="group" aria-label="${esc(t('worldMap'))}"><title>${esc(t('projection'))}</title>${grid}<text class="map-axis" x="8" y="16">90°N</text><text class="map-axis" x="8" y="352">90°S</text><text class="map-axis" x="8" y="190">180°W</text><text class="map-axis" x="666" y="190">180°E</text>${pins}</svg><p>${esc(t('projection'))}</p>${mapped.size?`<p>${esc(t('curatedNote'))}</p><details class="support-details" open><summary>${esc(t('mapList'))}</summary><ul class="map-location-list">${list}</ul></details>`:`<p class="map-empty">${esc(t('mapEmpty'))}</p>`}</section>`}
function activateMapTarget(target){const id=target.dataset.mapEvent;if(id){const card=document.getElementById('event-'+id);if(!card)return;const timeline=card.querySelector('.event-timeline');if(timeline)timeline.open=true;card.focus();card.scrollIntoView({block:'start',behavior:'auto'})}else if(target.dataset.mapList){const group=document.getElementById(target.dataset.mapList);if(group){group.focus();group.scrollIntoView({block:'nearest',behavior:'auto'})}}}
function eventCard(event,view){const records=linkedEvidence(event,view),zh=translated('events',event.event_id);const main=`<div class="event-main">${statusBadge('unverified')}<div class="state-code">${value(event.verification_status)}</div>${zh?`<div class="translation-label">${esc(t('translation'))}</div><h3 data-presentation-only="true" lang="zh-TW">${esc(zh)}</h3><div class="translation-label">${esc(t('original'))}</div><p class="original-title compact-title" lang="en">${value(event.event_title)}</p>`:`${language==='zh-TW'?`<div class="translation-label">${esc(t('originalOnly'))}</div>`:''}<h3 class="compact-title" lang="en">${value(event.event_title)}</h3>`}<div class="event-meta">${esc(t('source'))}: <strong>${value((event.source_names||[]).join(' · '))}</strong></div><div class="event-meta">${esc(t('articles'))}: <strong>${value(event.article_count)}</strong></div><div class="times"><div><span>${esc(t('detected'))}</span><time>${value(event.first_detected_at)}</time></div><div><span>${esc(t('latest'))}</span><time>${value(event.latest_article_at)}</time></div></div><details class="provenance"><summary>${esc(t('details'))}</summary><p>${esc(t('eventRef'))}: ${value(event.event_id)}</p><p lang="en">${value(event.event_title)}</p><p>${esc(t('occurred'))}: ${value(event.event_occurred_at)}</p><p>${esc(t('groupRule'))}: ${value(event.grouping?.rule)}</p>${(event.article_references||[]).map(ref=>`<p>${sourceLink(ref,t('articleLink'))} · ${value(ref)}</p>`).join('')}</details>${records.length?'':`<p class="no-evidence">${esc(t('noEvidence'))}</p>`}${eventGeography(event)}${eventTimeline(event)}</div>`;return `<article id="event-${esc(event.event_id)}" tabindex="-1" class="event-card ${records.length?'has-evidence':''}" data-event-id="${esc(event.event_id)}" data-event-status="${esc(event.verification_status)}">${records.length?`<div class="event-layout">${main}<div class="connection" aria-hidden="true">→</div>${officialPanel(records)}</div>`:main}</article>`}
function stage(label,english,count,countLabel,explanation,index){return `<section class="flow-stage"><div class="flow-index">0${index}</div><h2>${esc(t(label))}</h2><div class="stage-english" lang="en">${esc(english)}</div><div class="count" data-count="${esc(countLabel)}">${value(count)}</div><div class="count-label">${esc(t(countLabel))}</div><p>${esc(t(explanation))}</p></section>`}
function articleCard(item){return `<article class="news-item" data-article-status="${esc(item.verification_status)}">${statusBadge('unverified')}<div class="state-code">${value(item.verification_status)}</div><h3 lang="en">${value(item.title)}</h3><div class="event-meta">${esc(t('source'))}: ${value(item.news_source?.name)} · ${sourceLink(item.news_source?.url,t('articleLink'))}</div><div class="event-meta">${esc(t('observed'))}: <time>${value(item.observed_at||item.discovered_at)}</time></div><div class="event-meta">${esc(t(item.reported_time_kind==='SOURCE_DATE_PROXY'?'proxy':'reported'))}: <time>${value(item.reported_at)}</time></div><details class="provenance"><summary>${esc(t('details'))}</summary><p>${esc(t('reference'))}: ${value(item.article_reference||item.discovery_record_id)}</p><p>${esc(t('occurred'))}: ${value(item.event_occurred_at)}</p></details></article>`}
function discoverySources(view){const states=view.discovery_sources;if(!states||typeof states!=='object'||Array.isArray(states))return '';const labels={DISABLED:'disabledSource',STARTING:'acquisitionStarting',LIVE:'acquisitionLive',SNAPSHOT_FALLBACK:'acquisitionFallback',LAST_VALID_FALLBACK:'acquisitionFallback',UNAVAILABLE:'acquisitionUnavailable'};return `<section class="discovery-sources" aria-label="${esc(t('liveSources'))}"><h2>${esc(t('liveSources'))}</h2><div class="discovery-source-grid">${Object.entries(states).map(([name,state])=>`<section class="discovery-source" data-discovery-source="${esc(name)}" data-acquisition-status="${esc(state.status)}"><h3>${esc(name)}</h3><p>${esc(t(state.enabled===true?'enabledSource':state.enabled===false?'disabledSource':'unknown'))} · <span class="discovery-state">${esc(t(labels[state.status]||'unknown'))}</span> <span class="state-code">${value(state.status)}</span></p><p>${esc(t('lastRefresh'))}: <time>${value(state.last_success_at)}</time></p><p>${esc(t('newsCount'))}: ${value(state.article_count)}</p></section>`).join('')}</div><p>${esc(t('sourceAcquisitionNote'))}</p></section>`}
function ingestionNotice(view){const live=view.live_ingestion;if(live?.enabled){const title=live.status==='LIVE'?t('liveTitle'):live.status==='STARTING'?t('starting'):t('fallback');return `<aside class="demo-notice" data-live-status="${esc(live.status)}"><strong>${esc(title)}</strong><p>${esc(t('liveInfo'))}</p><p>${esc(t('lastRefresh'))}: <time>${value(live.last_success_at)}</time></p><p>${esc(t('acquisition'))}</p><div>${esc(t('source'))}: ${sourceLink('https://www.eia.gov/todayinenergy/','U.S. Energy Information Administration')} · ${esc(t('endorsement'))}</div></aside>`}if(Object.values(view.discovery_sources||{}).some(state=>state.enabled===true))return `<aside class="demo-notice"><strong>${esc(t('multiNoticeTitle'))}</strong><p>${esc(t('multiNoticeText'))}</p><p>${esc(t('acquisition'))}</p></aside>`;return APP_CONFIG.demoMode?`<aside class="demo-notice" aria-label="${esc(t('demo'))}"><strong>${esc(t('demo'))}</strong><p>${esc(t('demoText'))}</p><div>${esc(t('source'))}: ${sourceLink('https://www.eia.gov/todayinenergy/','U.S. Energy Information Administration')} · ${esc(t('endorsement'))}</div></aside>`:''}
function eventFeed(view){const events=view.events||[];const officialIds=new Set(events.flatMap(e=>linkedEvidence(e,view).map(x=>x.official_evidence_id)));const ordered=[...events].sort((a,b)=>Number(linkedEvidence(b,view).length>0)-Number(linkedEvidence(a,view).length>0));return `<div class="radar-feed"><section class="hero"><div class="eyebrow">${esc(t('eyebrow'))}</div><h1>${esc(t('brand'))}</h1><p class="intro">${esc(t('intro'))}</p><div class="flow" aria-label="${esc(t('intro'))}">${stage('news','News Discovery',view.news_item_count??view.item_count,'newsCount','discover',1)}<div class="flow-arrow" aria-hidden="true"></div>${stage('events','Canonical Events',view.distinct_event_count,'eventCount','organize',2)}<div class="flow-arrow" aria-hidden="true"></div>${stage('official','Official Evidence',officialIds.size,'factCount','verify',3)}</div></section>${ingestionNotice(view)}${discoverySources(view)}${worldMap(view)}<section class="legend" aria-label="${esc(t('official'))}"><div>${statusBadge('unverified')}<p>${esc(t('unverifiedMeaning'))}</p></div><div>${statusBadge('confirmed')}<p>${esc(t('confirmedMeaning'))}</p></div></section><div class="section-head"><div><h2>${esc(t('events'))}</h2><p>${esc(t('eventIntro'))}</p></div><button type="button" id="refresh">${esc(t('refresh'))}</button></div><p class="translation-note">${esc(t('translationNote'))}</p><p class="translation-note">${esc(t('sortNote'))}</p><section class="canonical-grid" data-canonical-count="${value(view.distinct_event_count)}">${ordered.map(e=>eventCard(e,view)).join('')||`<p class="empty">${esc(t('empty'))}</p>`}</section><div class="context"><span>${esc(t('feed'))}: <strong>${stateLabel(view.status)}</strong></span><span>${esc(t('latestObserved'))}: <strong>${value(view.latest_observed_data_at)}</strong></span><span>${esc(t('health'))}: <strong>${stateLabel(view.health_status)}</strong></span></div><details class="support-details"><summary>${esc(t('newsDetails'))} · ${value(view.news_item_count??view.item_count)} ${esc(t('newsCount'))}</summary><p>${esc(t('newsIntro'))}</p><div class="article-list">${(view.items||[]).map(articleCard).join('')||`<p class="empty">${esc(t('empty'))}</p>`}</div></details><details class="support-details"><summary>${esc(t('sourceDetails'))}</summary><p>${esc(t('healthNote'))}</p><div class="availability">${Object.entries(view.sources||{}).map(([key,state])=>`<div><h3>${esc(t(key==='news'?'newsSource':key==='official'?'officialSource':key))}</h3>${stateLabel(state.status)}<p>${esc(t('lastSuccess'))}: ${value(state.last_success_at)}</p></div>`).join('')}</div></details><details class="provenance"><summary>${esc(t('grouping'))}</summary><p>${esc(t('groupNote'))}</p><p>${esc(t('unassigned'))}: ${value(view.unassigned_article_count)}</p></details><footer>${esc(t('footer'))}</footer></div>`}
function render(){document.documentElement.lang=language;document.title=t('brand');document.getElementById('brand').textContent=t('brand');document.querySelectorAll('[data-language]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.language===language)));const app=document.getElementById('app');app.setAttribute('aria-busy',String(requestPending));app.innerHTML=lastError?`<p class="error" role="alert">${esc(t('error'))}: ${esc(lastError)}</p>`:currentView?eventFeed(currentView):`<p role="status">${esc(t('load'))}</p>`}
function setLanguage(next){if(!Object.hasOwn(STRINGS,next))return;language=next;try{localStorage.setItem('radar-language',language)}catch{}render()}
async function load(){if(requestPending)return;requestPending=true;lastError=null;render();try{const response=await fetch('/api/app/radar');const view=await response.json();if(!response.ok)throw Error(view.error||response.status);currentView=view}catch(error){lastError=error.message}finally{requestPending=false;render()}}
document.getElementById('language-control').addEventListener('click',event=>{const button=event.target.closest('[data-language]');if(button)setLanguage(button.dataset.language)});
document.getElementById('app').addEventListener('click',event=>{const mapTarget=event.target.closest('[data-map-event],[data-map-list]');if(mapTarget){event.preventDefault();activateMapTarget(mapTarget);return}if(event.target.closest('#refresh'))load()});
load();
</script>
</body>
</html>
