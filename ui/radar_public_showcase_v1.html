function reactionPanel(event,view){const c=researchCaseForEvent(view,event.event_id);if(c?.status!=='AVAILABLE'||c.receipt?.event_id!==event.event_id)return '';const r=c.receipt,a=r.pre_event_observation,b=r.post_event_observation,missing=r.intervening_unobserved_dates||[],eventDayPresent=r.observations.some(o=>o.observation_date===r.event_date);return `<section class="reaction-panel" data-receipt-contract="${esc(r.contract)}" data-receipt-event="${esc(r.event_id)}"><div class="eyebrow">EX_POST_MARKET_OBSERVATION</div><h3>${rx('Observed market reference changes','實際市場參考值變化')}</h3><p>${rx('EUR/USD · US dollars per 1 euro · ECB daily reference, not an executable price','EUR/USD · 每 1 歐元的美元數 · ECB 每日參考匯率，非可成交價格')}</p><div class="reaction-stats"><div>${rx('Earlier daily reference','事件前的每日參考值')}<strong>${value(a.value)}</strong><time>${value(a.observation_date)}</time></div><div>${rx('First later provider date','事件後第一個有資料日期')}<strong>${value(b.value)}</strong><time>${value(b.observation_date)}</time></div><div>${rx('Derived reference change','計算的參考值差異')}<strong>${Number(r.percentage_change)>0?'+':''}${value(r.percentage_change)}%</strong>${Number(r.absolute_change)>0?'+':''}${value(r.absolute_change)} USD / EUR</div></div><div class="reaction-chart-wrap">${reactionChart(r)}</div><p class="event-meta">${rx('Historical saved reference values, not live quotes. On small screens, swipe the chart; all values are selectable below.','保存的歷史參考值，非即時報價。小螢幕可左右滑動圖表；下方可選取全部數值。')}</p><div class="reaction-quotes">${r.observations.map((o,i)=>`<button type="button" data-reaction-index="${i}">${esc(o.observation_date.slice(5))} · ${esc(o.value)}</button>`).join('')}</div><p class="reaction-inspect" aria-live="polite">${rx('Select a real observation to inspect its provider date and value.','選取真實觀測，查看提供者日期與數值。')}</p><p>${missing.length?`${esc(t('missingProviderDates'))}: ${missing.map(esc).join(' · ')}. `:''}${eventDayPresent?rx('The event-day reference is shown but excluded from before/after section>`}
let selectedResearchCaseId=null,comparisonLeft=null,comparisonRight=null;

function comparisonChart(a,b){const vals=[Number(a.receipt.percentage_change),Number(b.receipt.percentage_change)],max=Math.max(...vals.map(Math.abs),.1),W=680,H=154,C=340,scale=290/(max*1.18),items=[a,b];return `<svg class="comparison-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${rx('Observed ECB EUR/USD daily reference percentage changes, not a performance score','ECB EUR/USD 每日參考匯率變化，不是績效評分')}"><line x1="${C}" x2="${C}" y1="8" y2="${H-12}" stroke="#748b98" stroke-dasharray="4 4"/><text x="${C}" y="14" text-anchor="middle" fill="#b9cbd3">0%</text>${items.map((c,i)=>{const v=Number(c.receipt.percentage_change),w=Math.abs(v)*scale,y=42+i*54,x=v>=0?C:C-w;return `<text x="8" y="${y+16}" fill="#d7e8ee">${esc(c.receipt.event_date)}</text><rect x="${x}" y="${y}" width="${Math.max(1,w)}" height="26" rx="5" fill="${v>=0?'#86d8c8':'#e5a47d'}"/><text x="${v>=0?x+w+8:x-8}" y="${y+18}" text-anchor="${v>=0?'start':'end'}" fill="#f2f6f8">${v>0?'+':''}${v.toFixed(6)}%</text>`}).join('')}</svg>`}
function compareCases(view,cases){if(cases.length<2)return `<p class="comparison-empty" role="status">${esc(t('comparisonUnavailable'))}</p>`;ensureResearchSelection(cases);const left=cases.find(c=>c.research_case_id===comparisonLeft)||cases[0],right=cases.find(c=>c.research_case_id===comparisonRight&&c.research_case_id!==left.research_case_id)||cases.find(c=>c.research_case_id!==left.research_case_id);if(!right)return `<p role="status">${esc(t('selectTwoCases'))}</p>`;comparisonRight=right.research_case_id;const a=left.receipt,b=right.receipt,compatible=a.instrument_id===b.instrument_id&&a.market_data_provider===b.market_data_provider&&a.data_frequency===b.data_frequency;const optionList=(selectedId)=>cases.map(c=>`<option value="${esc(c.research_case_id)}"${c.research_case_id===selectedId?' selected':''}>${esc(c.receipt.event_date)} · ${esc(c.article.title)}</option>`).join('');return `<section class="research-comparison" id="event-comparison"><div class="section-head"><div><h3>${esc(t('comparisonTitle'))}</h3><p>${esc(t('comparisonSubtitle'))}</p></div></div><div class="comparison-controls"><label>${esc(t('caseOne'))}<select data-research-compare="left">${optionList(comparisonLeft)}</select></label><label>${esc(t('caseTwo'))}<select data-research-compare="right">${optionList(comparisonRight)}</select></label></div>${left.research_case_id===right.research_case_id?`<p role="status">${esc(t('selectTwoCases'))}</p>`:!compatible?`<p role="status">${esc(t('comparisonIncompatible'))}</p>`:`<p class="comparison-direction">${rx('EUR/USD higher means more USD per EUR; lower means fewer USD per EUR. No direction is interpreted as ECB confirmation.','EUR/USD 上升表示每歐元可換得更多美元；下降則更少。方向不視為 ECB 假說獲得驗證。')}</p>${comparisonChart(left,right)}<div class="comparison-table-wrap"><table class="comparison-table"><thead><tr><th>${esc(t('comparisonField'))}</th><th>${esc(a.event_date)}</th><th>${esc(b.event_date)}</th></tr></thead><tbody><tr><th>${esc(t('eventDecision'))}</th><td>${esc(left. function predictionMarketWatch(view){const watch=view.prediction_market_watch;if(!watch)return unlinkedExpectations(view);const stateNames={ACTIVE:'watchActive',CLOSED:'watchClosed',UNKNOWN:'watchUnknown'};const markets=watch.markets||[];const visible=markets.filter(m=>(watchCategory==='ALL'||m.category===watchCategory)&&(watchState==='ALL'||m.market_status===watchState));const categories=['ALL',...(watch.categories||[])];const states=['ALL',...['ACTIVE','CLOSED','UNKNOWN'].filter(s=>markets.some(m=>m.market_status===s))];const cards=visible.map(m=>`<article class="watch-card" data-market-id="${esc(m.market_id)}" data-watch-source="${esc(m.source_status)}"><div class="watch-badges"><span>${esc(t(m.category))}</span><span>${esc(t(stateNames[m.market_status]||'watchUnknown'))}</span><span>${esc(t(m.source_status))}</span></div>${marketQuestion(m)}<div class="state-code">${esc(t('expectationOnly'))} · EXPECTATION_SENSOR · ${esc(t(m.outcome_type))}</div><span class="field-label">${esc(t('watchPrice'))}</span><ul class="watch-outcomes">${Array.isArray(m.outcomes)?m.outcomes.map((o,i)=>`<li><span>${marketOutcome(o)}</span><strong>${expectationProbability(m.probabilities?.[i])}</strong></li>`).join(''):`<li>${value(null)}</li>`}</ul><div class="watch-updated"><span>${esc(t('watchObserved'))}: <time>${value(m.observed_at)}</time></span><span>${esc(t('watchUpdated'))}: <time>${value(m.provider_updated_at)}</time></span></div><p>${sourceLink(m.market_url,t('viewMarket'))}</p>${m.link_status==='LINKED'&&m.canonical_event_id?`<button type="button" data-map-event="${esc(m.canonical_event_id)}">${esc(t('watchRelated'))}</button>`:`<p class="watch-meta">${esc(t('watchNoLink'))}</p>`}<details><summary>${esc(t('watchDetails'))}</summary><p>${esc(t('watchGroup'))}: ${value(m.provider_event_ids?.join(' · ')||null)}</p><p>${esc(t('watchRelevance'))}: ${value(m.relevance_reason)}</p><p>${esc(t('watchOutcomeIds'))}: ${value(m.outcome_identifiers?.join(' · ')||null)}</p><p>${esc(t('watchLiquidity'))}: ${value(m.liquidity)} · ${esc(t('watchVolume'))}: ${value(m.volume)}</p><p>${value(m.proposition_metadata?.resolution_criteria||m.proposition_metadata?.description)}</p>${sourceLink(m.proposition_metadata?.resolution_source,t('source'))}</details></article>`).join('');return `<section id="prediction-market-watch" class="prediction-watch" aria-label="${esc(t('watchTitle'))}"><h2>${esc(t('watchTitle'))}</h2><p class="watch-disclosure">${esc(t('watchIntro'))}</p><p class="watch-meta">Polymarket · ${esc(t(watch.source_status))} · ${esc(t('watchCount'))}: ${value(watch.market_count)} ${watch.provider?.reason?`<span class="state-code">${value(watch.provider.reason)}</span>`:''}</p><p class="watch-meta">${esc(t('guideLinkedMarkets'))}: ${markets.filter(m=>m.link_status==='LINKED'&&m.canonical_event_id).length} · ${esc(t('guideUnlinkedMarkets'))}: ${markets.filter(m=>m.link_status!=='LINKED'||!m.canonical_event_id).length}</p><div class="watch-filters" aria-label="${esc(t('watchTitle'))}">${categories.map(c=>`<button type="button" data-watch-category="${esc(c)}" aria-pressed="${c===watchCategory}">${esc(t(c==='ALL'?'allMacro':c))}</button>`).join('')}</div><div class="watch-filters">${states.map(s=>`<button type="button" data-watch-state="${esc(s)}" aria-pressed="${s===watchState}">${esc(t(s==='ALL'?'watchAllStates':stateNames[s]))}</button>`).join('')}</div><div class="watch-grid">${cards||`<p class="empty">${esc(t(watch.status==='UNAVAILABLE'?'watchUnavailable':markets.length?'watchNoFilter':'watchEmpty'))}</p>`}</div><p class="watch-disclosure">${esc(t('watchOutcomeNote'))}</p><p class="watch-disclosure">${esc(t('watchScope'))}</p></section>`}
function macroviewPanel(event,view){const preview=(view.macroview_previews||[]).find(p=>p.canonical_event_id===event.event_id&&p.preview_only===true&&p.persisted===false);if(!preview)return `<section class="macroview-preview"><h4>${esc(px('previewTitle'))}</h4><p>${esc(t('UNAVAILABLE_HISTORY'))}</p></section>`;return `<details class="macroview-preview" id="macroview-${esc(event.event_id)}" data-macroview-id="${esc(preview.macroview_id)}"><summary>${esc(px('previewTitle'))}</summary><p class="knowledge-state">${esc(px('previewBoundary'))}</p>${researchCaseForEvent(view,event.event_id)?`<p class="clock-note">${esc(px('historicalPreview'))}</p>`:''}<p>${esc(t('knowledgeNote'))}</p><p>${esc(t('macroviewNote'))} ${esc(px('previewExplanation'))}</p><dl class="product-key-values"><dt>${esc(px('previewClock'))}</dt><dd>${preview.as_of?productTime(preview.as_of):esc(px('notRecorded'))}</dd><dt>${esc(px('currentFacts'))}</dt><dd>${esc(t(preview.fact_state))}</dd></dl><ul>${(preview.snapshot?.official_evidence||[]).map(e=>`<li>${value(e.authority_name)}: ${value(e.fact_proposition)}</li>`).join('')||`<li>${esc(px('factsMissing'))}</li>`}</ul><span class="field-label">${esc(t('expectations'))}</span><strong>${esc(t(preview.expectation_state))}</strong>${expectationRows(preview.snapshot?.market_expectations||[])}<p>${esc(t('marketDisclosure'))}</p><h4>${esc(t('unknowns'))}</h4><ul>${(preview.unknowns||[]).map(key=>`<li>${esc(t(key))}</li>`).join('')}</ul><div class="event-quick-actions"><button type="button" data-event-panel="readiness" data-product-event="${esc(event.event_id)}">${esc(px('readiness'))}</button><button type="button" data-event-panel="replay" data-product-event="${esc(event.event_id)}">${esc(px('openReplay'))}</button></div><details class="provenance"><summary>${esc(t('details'))}</summary><p>${value(preview.macroview_id)}</p><p>${value(preview.provenance?.snapshot_sha256)}</p></details></details>`}
function replayResult(result){if(result.replay_status==='NO_OBSERVATIONS')return `<p>${esc(t('replayEmpty'))}</p>`;const groups=[['news_observations','replayNews'],['official_evidence_observations','replayOfficial'],['market_expectation_observations','replayMarkets']];const snapshot=result.reconstructed_macroview;const replayContext=snapshot?.snapshot?.event;return `<p class="state-code">${value(result.replay_status)} · ${value(result.as_of)}</p>${groups.map(([key,label])=>`<h4>${esc(t(label))}: ${(result[key]||[]).length}</h4><ol>${(result[key]||[]).map(row=>`<li><strong>${value(row.payload?.title||row.payload?.fact_proposition||row.payload?.question)}</strong><p>${esc(t('replayObserved'))}: <time>${value(row.observed_at)}</time> · ${esc(t(row.active_at_as_of?'replayActive':'replayHistory'))}</p>${row.observation_kind==='MARKET_EXPECTATION'?`<p>EXPECTATION_SENSOR · ${value(row.payload?.probabilities)}</p>`:''}</li>`).join('')}</ol>`).join('')}${snapshot?`<h4>${esc(t('replayMacro'))}</h4><p>${esc(t(snapshot.fact_state))} · ${esc(t(snapshot.expectation_state))}</p>`:''}${replayContext?marketRealityPanel({...replayContext,market_reality:snapshot.snapshot.market_reality}):''}${replayContext?.context_contract?contextPanel(replayContext):`<p>${esc(t('contextNotObserved'))}</p>`}<h4>${esc(t('unknowns'))}</h4><ul>${(result.unknowns||[]).map(code=>`<li>${esc(t(code))}</li>`).join('')}</ul>`}
function realityReplay(event){const state=replayStates.get(event.event_id);const inputId='replay-time-'+event.event_id;return `<details class="reality-replay" ${state?'open':''}><summary>${esc(t('realityReplay'))}</summary><p>${esc(t('replayNote'))}</p><p>${esc(t('guideReplay'))}</p>${localLabPresets(event)}${state?.result?'':`<p class="replay-knowledge-state">${esc(px(currentView?.research_capabilities?.as_of_reader_status==='UNAVAILABLE_NO_READABLE_LEDGER'?'ledgerUnavailable':'historyNotQueried'))}</p>`}<div class="replay-controls"><label for="${esc(inputId)}">${esc(t('replayAsOf'))}<input id="${esc(inputId)}" type="text" autocomplete="off" placeholder="YYYY-MM-DDTHH:mm:ssZ" value="${esc(state?.asOf||'')}"></label><button type="button" data-replay-request="${esc(event.event_id)}" ${state?.loading?'disabled':''}>${esc(t('replayLoad'))}</button><button type="button" data-research-request="${esc(event.event_id)}" ${state?.loading?'disabled':''}>${esc(px('asOfLoad'))}</button></div><p class="clock-note">${esc(px('asOfBoundary'))}</p><div class="replay-result" aria-live="polite" role="status">${replayStateContent(state)}</div></details>`}
async function loadReplay(eventId,mode='replay'){const previous=replayStates.get(eventId);if(previous?.loading)return;const lastGood=previous?.mode===mode?(previous.result||previous.lastGood):null;const input=document.getElementById('replay-time-'+eventId);const asOf=input?.value?.trim()||'';if(window.RadarProductWorkbench.instant(asOf)===null){replayStates.set(eventId,{asOf,mode,loading:false,error:'INVALID_ASOF_TIME',lastGood});render();return}replayStates.set(eventId,{asOf,mode,loading:true,lastGood});render();const controller=typeof AbortController==='function'?new AbortController():null;const timer=controller&&typeof setTimeout==='function'?setTimeout(()=>controller.abort(),10000):null;try{const response=await fetch((mode==='research'?'/api/app/research':'/api/app/replay')+'?event_id='+encodeURIComponent(eventId)+'&as_of='+encodeURIComponent(asOf),controller?{signal:controller.signal}:undefined);let result;try{result=await response.json()}catch{throw Error('INVALID_REPLAY_RESPONSE')}if(!response.ok){const code=result?.error;throw Error(typeof code==='string'&&/^[A-Z][A-Z0-9_]{0,79}$/.test(code)?code:'REPLAY_HTTP_'+response.status)}result=window.RadarProductWorkbench.validateAsOf(result,eventId,asOf,mode);if(result.local_frozen_candidates?.length&&(currentView?.data_scope!=='SYNTHETIC_TEST_FIXTURE'||currentView?.local_research_lab?.scope!=='SYNTHETIC_LOCAL_RESEARCH_LAB_ONLY'))throw Error('LOCAL_CANDIDATE_SCOPE_REQUIRED');replayStates.set(eventId,{asOf,mode,loading:false,result,comparisonBase:lastGood})}catch(error){replayStates.set(eventId,{asOf,mode,loading:false,lastGood,error:error.name==='AbortError'?'REQUEST_TIMEOUT':/^[A-Z][A-Z0-9_]{0,79}$/.test(error.message)?error.message:'REPLAY_UNAVAILABLE'})}finally{if(timer!==null&&typeof clearTimeout==='function')clearTimeout(timer);render()}}

function localFrozenPanel(result){const candidates=result.local_frozen_candidates||[],lab=currentView?.local_research_lab;if(currentView?.data_scope!=='SYNTHETIC_TEST_FIXTURE'||lab?.scope!=='SYNTHETIC_LOCAL_RESEARCH_LAB_ONLY')return `<p class="clock-note">${esc(px('frozenBoundary'))}</p>`;return `<section class="local-freeze-candidates"><h4>${esc(px(candidates.length?'localFrozen':'localFrozenMissingTitle'))}</h4><p>${esc(px('candidateDisclaimer'))}</p>${candidates.length?candidates.map(c=>`<details class="local-freeze-receipt" data-local-freeze="SYNTHETIC_FROZEN_CANDIDATE"><summary>${esc(px('candidateReceipt'))}</summary><dl class="product-key-values"><dt>${esc(px('candidateAsOf'))}</dt><dd>${researchClock(c.receipt.evidence_as_of)}</dd><dt>${esc(px('candidateCreated'))}</dt><dd>${researchClock(c.receipt.created_at)}</dd><dt>${esc(px('asOfClock'))}</dt><dd>${researchClock(result.as_of)}</dd><dt>Receipt</dt><dd><code>${esc(c.receipt.receipt_id)}</code></dd><dt>Snapshot SHA256</dt><dd><code>${esc(c.receipt.snapshot_sha256)}</code></dd><dt>Ledger</dt><dd><code>${esc(c.receipt.ledger_id)}</code></dd></dl><p>${esc(c.receipt.verification_status)} · ${esc(c.receipt.contract_status)} · production_authorized=false</p><ul>${(c.snapshot.snapshot?.news||[]).map(n=>`<li>${value(n.title)}</li>`).join('')}</ul><h4>${esc(px('supported'))}</h4><ul>${(c.snapshot.snapshot?.official_evidence||[]).map(f=>`<li>FACT_AUTHORITY · ${value(f.fact_proposition)}</li>`).join('')}</ul><h4>${esc(px('expectationsOnly'))}</h4><ul>${(c.snapshot.snapshot?.market_expectations||[]).map(m=>`<li>EXPECTATION_SENSOR · ${value(m.question)} · ${researchOutcomes(m)}</li>`).join('')}</ul></details>`).join(''):`<p>${esc(px('candidateMissing'))}</p>`}</section>`}

function replayStateContent(state){if(!state)return '';const retained=state.mode==='research'&&state.lastGood?`<aside class="retained-asof"><p class="knowledge-state">${esc(px('retained'))} · ${researchClock(state.lastGood.as_of)}</p>${asOfResearchResult(state.lastGood)}</aside>`:'';if(state.loading)return `<p>${esc(t('replayLoading'))}</p>${retained}`;if(state.error)return `<p>${esc(state.mode==='research'?px('asOfUnavailable'):t('replayUnavailable'))} ${value(state.error)}</p>${retained}`;return state.result?(state.mode==='research'?asOfResearchResult(state.result,state.comparisonBase):replayResult(state.result)):''}

function intelligenceVisible(view){return window.RadarProductWorkbench.filterEvents(view,{query:productQuery,source:productSource,evidence:productEvidence,translatedTitles:productTranslated(view)}).filter(e=>intelligenceCategory==='ALL'||view.research_brief.event_briefs[e.event_id]?.category===intelligenceCategory).sort((a,b)=>{const p={FOCUS:0,STANDARD:1,CONTEXT:2},brief=view.research_brief.event_briefs;return (p[brief[a.event_id]?.priority]??3)-(p[brief[b.event_id]?.priority]??3)||String(b.latest_article_at||'').localeCompare(a.latest_article_at||'')||a.event_id.localeCompare(b.event_id)})}
function intelligencePanel(event,view){const b=view.research_brief?.event_briefs?.[event.event_id];if(!b)return '';const zh=language==='zh-TW',s=zh?'zh':'en';return `<section class="research-brief" data-brief-event="${esc(event.event_id)}"><h4>${esc(iw('what'))}</h4><p>${esc(b['what_happened_'+s])}</p>${language==='zh-TW'&&headlineEventTranslation(event,view)?`<blockquote lang="zh-TW">${esc(headlineEventTranslation(event,view).translated_title)}</blockquote>`:''}<blockquote lang="en">${esc(b.reported_claim)}</blockquote>${headlineTranslationNote(event,view)}<h4>${esc(iw('why'))} · ${esc(b['channel_'+s])}</h4><p>${esc(b['mechanism_'+s])}</p><p class="product-chip warning">${esc(iw('hypothesis'))}</p><h4>${esc(iw('confirmed'))}</h4>${b.confirmed_propositions.length?`<ul>${b.confirmed_propositions.map(f=>`<li>${value(f.fact_proposition)} · ${sourceLink(f.document_url,iw('sourceLink'))}</li>`).join('')}</ul>`:`<p>${esc(iw('none'))}</p>`}<h4>${esc(iw('unknown'))}</h4><ul>${b['unknown_'+s].map(x=>`<li>${esc(x)}</li>`).join('')}</ul><h4>${esc(iw('watch'))}</h4><p>${esc(b['watch_'+s])}</p>${candidateLinks(event,view)}${b.related_candidates.length?`<h4>${esc(iw('related'))}</h4><ul>${b.related_candidates.map(r=>`<li><a href="#/event/${encodeURIComponent(r.event_id)}?panel=evidence">${esc(r.title)}</a><p>${esc(r['reason_'+s])} · ${esc(r.shared_anchors.join(', '))}</p></li>`).join('')}</ul>`:''}<details class="brief-clocks"><summary>${esc(iw('clocks'))}</summary>${b.article_clocks.map(a=>`<section><p>${sourceLink(a.article_reference,a.source||iw('sourceLink'))}</p><dl class="product-key-values"><dt>${esc(iw('published'))}</dt><dd>${researchClock(a.source_published_at)} · ${esc(a.publication_precision)}</dd><dt>${esc(iw('retrieved'))}</dt><dd>${researchClock(a.retrieved_at)}</dd><dt>${esc(iw('recorded'))}</dt><dd>${researchClock(a.recorded_at)}</dd><dt>${esc(iw('first'))}</dt><dd>FIRST_SEEN_NOT_PROVEN</dd></dl><p>${esc(a.public_usage)}</p>${a.attribution?`<p>${esc(a.attribution.author||'')} · ${esc(a.attribution.requirements)} ${a.attribution.license_url?sourceLink(a.attribution.license_url,iw('license')):''}</p>`:''}<p>${esc(iw('metadata'))}</p><p class="state-code">Metadata SHA256: ${esc(a.content_sha256||'UNKNOWN')}<br>Response SHA256: ${esc(a.receipt_sha256||'UNKNOWN')}</p></section>`).join('')}</details></section>`}
function intelligenceControls(view){const q=new URLSearchParams(location.search),profile=q.get('profile')||'public',period=q.get('window')||'168';return `<form id="intelligence-scope" method="get" class="intelligence-controls"><label>${esc(iw('profile'))}<select name="profile" data-profile>${[['public','public'],['baseline','baseline']].map(([v,k])=>`<option value="${v}" ${profile===v?'selected':''}>${esc(iw(k))}</option>`).join('')}</select></label><label>${esc(iw('period'))}<select name="window" data-window><option value="48" ${period==='48'?'selected':''}>48h</option><option value="168" ${period==='168'?'selected':''}>7d</option></select></label><button>${esc(iw('apply'))}</button></form>`}
function intelligenceHealth(view){if(!view.local_coverage)return `<details id="data-source-status" class="support-details"><summary>${esc(t('dataSourceStatus'))}</summary>${compactSourceHealth(view)}${readingGuide(view)}${discoverySources(view)}${dataHealth(view)}${ingestionNotice(view)}</details>`;const info=view.local_coverage,rows=view.local_source_registry||[];return `<details id="data-source-status" class="support-details"><summary>${esc(iw('data'))} · ${rows.filter(r=>r.availability==='SAVED_HTTP_200').length}/${rows.filter(r=>r.availability!=='UNTESTED').length} feed records successful</summary><p>${esc(iw('notPIT'))}</p><p>LATENCY_UNKNOWN · FIRST_SEEN_NOT_PROVEN · ${esc(iw('unavailable'))}</p><p>${esc(iw('cutoff'))}: ${researchClock(info?.publication_window_end)}</p><div class="source-registry">${rows.map(r=>`<section><strong>${esc(r.source_id)}</strong> · ${esc(r.usage_status)} · ${esc(r.availability)}<p>HTTP ${esc(r.http_statuses.join(', ')||'UNTESTED')} · ${r.raw_articles} metadata · ${researchClock(r.latest_source_published)}</p><p>${esc(r.requirements||'UNKNOWN')}</p>${r.policy_url?sourceLink(r.policy_url,iw('license')):''}</section>`).join('')}</div>${readingGuide(view)}${dataHealth(view)}</details>`}
function intelligenceFilters(view){const sources=window.RadarProductWorkbench.sourceNames(view),briefs=view.research_brief.event_briefs;return `<form id="research-filters" class="intelligence-search" role="search"><div class="intelligence-search-row"><label class="search-field" for="research-query">${esc(iw('search'))}<input id="research-query" type="search" maxlength="160" autocomplete="off" placeholder="${esc(px('queryHint'))}" value="${esc(productQuery)}"></label><button type="button" data-product-reset>${esc(px('clear'))}</button></div><details class="intelligence-filter-more"><summary>${esc(px('source'))} / ${esc(px('evidence'))} / ${esc(iw('category'))}${intelligenceCategory!=='ALL'?' · '+esc(intelCat(intelligenceCategory)):''}</summary><div class="intelligence-more-grid"><label>${esc(px('source'))}<select id="research-source"><option value="ALL">${esc(px('allSources'))}</option>${sources.map(s=>`<option value="${esc(s)}" ${productSource===s?'selected':''}>${esc(s)}</option>`).join('')}</select></label><label>${esc(px('evidence'))}<select id="research-evidence">${[['ALL','allEvidence'],['OFFICIAL','hasOfficial'],['NEWS_ONLY','newsOnly']].map(([k,label])=>`<option value="${k}" ${productEvidence===k?'selected':''}>${esc(px(label))}</option>`).join('')}</select></label><label>${esc(iw('category'))}<select id="research-category"><option value="ALL">${esc(iw('all'))}</option>${[...new Set(Object.values(briefs).map(b=>b.category))].sort().map(c=>`<option value="${c}" ${intelligenceCategory===c?'selected':''}>${esc(intelCat(c))}</option>`).join('')}</select></label></div></details></form>`}

function articleHeadline(item){const r=window.RadarHeadlinePresentation?.article?.(item),zh=language==='zh-TW';return `<h3 lang="${zh&&r?'zh-TW':'en'}" data-article-headline>${esc(zh&&r?r.translated_title:item.title)}</h3>`+(zh&&r?`<p class="headline-original" lang="en">${esc(item.title)}</p>`:zh?`<p class="translation-fallback">尚無相符的繁中譯文，保留原始標題。</p>`:'')}
function headlineArticleSearch(view){return Object.fromEntries((view.items||[]).map(a=>[a.article_reference,window.RadarHeadlinePresentation?.article?.(a)?.translated_title||'']))}

function headlineEventTranslation(event,view){return window.RadarHeadlinePresentation?.event?.(event,view)||null}
function headlineMarkup(event,view,link=true){const r=headlineEventTranslation(event,view),zh=language==='zh-TW';const title=zh&&r?r.translated_title:event.event_title;const primary=`<span lang="${zh&&r?'zh-TW':'en'}" data-headline-primary data-translation-status="${zh&&r?r.status:'ORIGINAL_ONLY'}">${esc(title)}</span>`;return (link?`<h3><a href="#/event/${encodeURIComponent(event.event_id)}?panel=evidence">${primary}</a></h3>`:`<h3>${primary}</h3>`)+(zh&&r?`<p class="headline-original" lang="en" data-headline-original>${esc(event.event_title)}</p>`:zh?`<p class="translation-fallback">尚無相符的繁中譯文，保留原始標題。</p>`:'')}
function headlineTranslationNote(event,view){const r=headlineEventTranslation(event,view);if(language!=='zh-TW'||!r)return '';return `<details class="translation-provenance"><summary>標題譯文 · 非官方翻譯</summary><p>${r.status==='REVIEWED_LOCAL_CANDIDATE'?'本機逐版審查譯文，審查者：'+esc(r.reviewer):'由 Codex 逐題編譯並對照原文'}；不是已接通的自動翻譯。只用於顯示與搜尋，不是證據，也不參與事件身分、排序或 PIT。</p><p>版本 ${esc(r.translation_version)} · ${esc(r.adapter_version)} · 建立時間 ${researchClock(r.created_at)}</p><p>原始標題 SHA256: <code>${esc(r.source_title_sha256)}</code></p><p>${sourceLink(r.source_url,'英文原始來源')} · ${esc(r.attribution?.author||r.attribution?.source||'')}</p></details>`}

function candidateLinks(event,view){const rows=(view.article_event_links?.candidate_links||[]).filter(r=>r.left_existing_event_id===event.event_id||r.right_existing_event_id===event.event_id);return rows.length?`<section class="candidate-article-links"><h4>${language==='zh-TW'?'跨文章候選關聯（未合併）':'Cross-article candidates (not merged)'}</h4>${rows.map(r=>{const other=r.left_existing_event_id===event.event_id?r.right_existing_event_id:r.left_existing_event_id;return `<p><a href="#/event/${encodeURIComponent(other)}?panel=evidence">${esc(r.relation)}</a> · UNKNOWN</p><p>${language==='zh-TW'?'僅依具名議題與發布時間接近提出；是否同一事件、說法是否一致均未確立。':'Named topic and publication proximity only; same occurrence and agreement are not established.'}</p><details><summary>${language==='zh-TW'?'配對理由':'Pair rationale'}</summary>${esc(r.rationale)}</details>`}).join('')}</section>`:''}
function integrationDiagnostics(view){const f=view.coverage_funnel,q=view.translation_pipeline;if(!f&&!q)return '';const zh=language==='zh-TW';return `<details id="integration-diagnostics" class="support-details"><summary>${zh?'來源漏斗與翻譯佇列':'Source funnel & translation queue'} · ${q?.status||'UNAVAILABLE'}</summary><p>${zh?'以下數字只描述保存的一次性快照，非即時覆蓋率或 PIT 歷史。':'Counts describe the saved one-shot snapshot, not real-time coverage or PIT history.'}</p>${f?`<dl class="product-key-values"><dt>${zh?'Feed 原始筆數':'Raw feed records'}</dt><dd data-funnel-raw>${f.raw_feed_articles}</dd><dt>${zh?'有效 metadata':'Valid metadata'}</dt><dd>${f.valid_articles}</dd><dt>${zh?'宏觀候選（整份資料）':'Macro candidates (dataset)'}</dt><dd>${f.macro_relevant_candidates}</dd><dt>${zh?'目前窗口內候選（未去重）':'Candidates in selected window (before dedup)'}</dt><dd>${f.event_article_candidates_before_dedup}</dd><dt>${zh?'顯示文章／研究群組':'Displayed articles / research groups'}</dt><dd>${view.items.length} / ${view.events.length}</dd><dt>${zh?'窗口截止':'Publication window ends'}</dt><dd>${researchClock(view.local_coverage?.publication_window_end)}</dd></dl><div class="table-scroll"><table><thead><tr><th>${zh?'來源':'Source'}</th><th>Raw</th><th>Valid</th><th>${zh?'窗口':'Window'}</th><th>${zh?'顯示':'Shown'}</th><th>${zh?'未進入的原因（可重疊）':'Attrition reasons (may overlap)'}</th></tr></thead><tbody>${Object.entries(f.source_attribution).map(([name,r])=>`<tr><td>${esc(name)} · ${esc(r.availability)}</td><td>${r.raw_feed}</td><td>${r.valid}</td><td>${r.window}</td><td>${r.displayed_unique_references}</td><td>${esc(Object.entries(r.attrition_reasons).map(([k,n])=>k+': '+n).join('; ')||'—')}</td></tr>`).join('')}</tbody></table></div>`:''}<h4>${zh?'新標題翻譯管線':'New-headline translation pipeline'}</h4><p data-translation-provider>${esc(q?.status||'UNAVAILABLE')} · ${zh?'沒有已核准的執行引擎；不會呼叫外部服務。已審查的譯文仍可使用，其他保留原文。':'No approved runtime engine; no external service calls. Reviewed translations remain usable; others retain originals.'}</p><p>${esc(Object.entries(q?.states||{}).map(([s,n])=>s+': '+n).join(' · '))}</p><p>${zh?'本預覽未部署翻譯佇列；只讀取既有編譯，頁面不能寫入或啟動 provider。':'No translation queue is deployed. Curated display translations only; requests cannot write or start providers.'}</p></details>`}
function newsFirstFeed(view){const visible=intelligenceVisible(view),briefs=view.research_brief.event_briefs;const l=view.local_coverage,local=!!l,stale=local&&view.items.some(a=>Date.now()-Date.parse(a.local_observation?.retrieved_at)>1800000);return `<div class="radar-feed news-first"><section class="news-first-heading"><div><div class="eyebrow">MACRO RESEARCH · EVIDENCE FIRST</div><h1>${esc(iw('title'))}</h1><p>${esc(iw('intro'))}</p></div><button id="refresh" type="button" ${requestPending?'disabled':''}>${esc(t('refresh'))}</button></section>${local?`<aside class="headline-safety" data-local-scope="FRIENDS_PREVIEW_SAVED_PUBLIC"><span>${view.data_scope==='SYNTHETIC_TEST_FIXTURE'?'SYNTHETIC · LOCAL TEST':'FRIENDS PREVIEW / SAVED SNAPSHOT'}</span><span>${language==='zh-TW'?'採集 OFF · 尚未核實':'Capture OFF · Unverified'}</span><details id="headline-data-notes"><summary>${language==='zh-TW'?'資料狀態與翻譯說明':'Data & translation notes'}</summary><p>${esc(iw('noCapture'))}</p><p>${esc(iw('retrieved'))}: ${productTime(l.latest_retrieved_at)}</p><p data-source-stale>${esc(iw(stale?'stale':'fresh'))}</p><p>${esc(iw('notPIT'))}</p><p>${language==='zh-TW'?'本輪編譯標題，非官方譯文；未來新標題尚未接通自動翻譯，未命中版本時保留原文。':'Curated unofficial titles; future automatic translation is not integrated. Unmatched revisions retain their original title.'}</p></details></aside>${intelligenceControls(view)}`:productDataState(view)}${productGuide(view)}<section id="research-workbench"><div class="headline-heading"><h2>${esc(iw('headlines'))}</h2><span><strong data-article-count>${view.items.length}</strong> ${esc(iw('articles'))} / <strong data-group-count>${view.events.length}</strong> ${esc(iw('groups'))}</span></div>${intelligenceFilters(view)}<p class="filter-result" role="status"><strong data-filtered-event-count>${visible.length}</strong> ${language==='zh-TW'?'個群組顯示中':'groups shown'} · ${esc(iw('notEvents'))}</p><div class="headline-list">${visible.map(e=>{const b=briefs[e.event_id];return `<article class="headline-row" data-headline-event="${esc(e.event_id)}"><div class="headline-rank"><span class="priority-${esc(b.priority)}">${esc(iw(b.priority.toLowerCase()==='standard'?'standard':b.priority.toLowerCase()))}</span><span>${esc(intelCat(b.category))}</span></div><div>${headlineMarkup(e,view)}<p class="headline-meta">${esc((e.source_names||[]).join(' · '))} · ${esc(iw('published'))}: ${productTime(e.latest_article_at)} · ${esc(iw('retrieved'))}: ${productTime(b.article_clocks?.[0]?.retrieved_at)} · ${esc(b.category==='EXPECTATION_CONTEXT'?(language==='zh-TW'?'發布前／市場預期':'Pre-release / market expectation'):iw(b.article_kind==='ANALYSIS_CONTEXT'?'analysis':'reported'))}</p><p class="headline-reason">${esc(b['priority_reason_'+(language==='zh-TW'?'zh':'en')])}</p><span class="verification-label">${esc(iw('unverified'))}</span> <button class="headline-open" type="button" data-product-event="${esc(e.event_id)}" data-event-panel="evidence">${esc(iw('open'))} →</button></div></article>`}).join('')||`<p class="empty">${esc(iw('zero'))}</p>`}</div><p class="clock-note">${esc(iw('sort'))} ${esc(iw('notPIT'))}</p></section><details id="market-intelligence" class="product-secondary"><summary>${esc(iw('intelligence'))} · ${visible.length}</summary><p>${esc(iw('intelligenceNote'))}</p><section id="canonical-events" class="canonical-grid" data-canonical-count="${view.events.length}">${visible.map(e=>eventCard(e,view)).join('')}</section></details>${integrationDiagnostics(view)}${reactionResearch(view)}<details id="recent-workspace" class="product-secondary"><summary>${esc(px('activity'))}</summary>${macroBrief(view)}${relatedNews(view)}${latestNews(view)}</details><details id="map-workspace" class="product-secondary"><summary>${esc(px('mapWorkspace'))}</summary>${worldMap(view)}</details>${predictionMarketWatch(view)}${intelligenceHealth(view)}<footer>${esc(t('footer'))}</footer></div>`}
document.getElementById('app').addEventListener('change',e=>{if(e.target.id==='research-category'){clearEventRouteOnFilter();intelligenceCategory=e.target.value;render();document.getElementById('research-category')?.focus({preventScroll:true})}});

function eventFeed(view){if(view.research_brief?.contract==='RESEARCH_BRIEF_PREVIEW_V1')return newsFirstFeed(view);const events=view.events||[],officialIds=new Set(events.flatMap(e=>linkedEvidence(e,view).map(x=>x.official_evidence_id)));const visible=window.RadarProductWorkbench.filterEvents(view,{query:productQuery,source:productSource,evidence:productEvidence,translatedTitles:productTranslated(view)});const ordered=[...visible].sort((a,b)=>Number(linkedEvidence(b,view).length>0)-Number(linkedEvidence(a,view).length>0));const recent=Array.isArray(view.news_intelligence?.brief)&&view.news_intelligence.brief.length>0||view.news_freshness?.last_48h_article_count>0;const historicalCount=window.RadarProductWorkbench.summarize(view,{demoMode:APP_CONFIG.demoMode}).historicalCaseCount;return `<div class="radar-feed"><section id="research-overview" class="hero research-hero"><div><div class="eyebrow">MACRO RESEARCH · EVIDENCE FIRST</div><h1>${esc(px('desk'))}</h1><p class="intro">${esc(px('deskIntro'))}</p><div class="research-flow"><span>${esc(px('step1'))}</span><span>${esc(px('step2'))}</span><span>${esc(px('step3'))}</span><span>${esc(px('step4'))}</span></div></div><aside class="research-start"><h2>${esc(px('start'))}</h2><p>${historicalCount?esc(px('startNote').replace('{count}',String(historicalCount))):esc(t('UNAVAILABLE_HISTORY'))}</p><a href="${historicalCount?'#historical-research':'#data-source-status'}">${esc(historicalCount?px('openHistory'):t('navHealth'))} →</a></aside></section><div class="flow product-counts" aria-label="${esc(t('intro'))}">${stage('news','News Discovery',view.news_item_count??view.item_count,'newsCount','discover',1)}${stage('events','Canonical Events',view.distinct_event_count,'eventCount','organize',2)}${stage('official','Official Evidence',officialIds.size,'factCount','verify',3)}</div>${productGuide(view)}${productDataState(view)}${productRouteMessage?`<p class="inline-status" role="status">${esc(productRouteMessage)}</p>`:''}<section id="research-workbench"><div class="workbench-heading"><div><h2>${esc(px('eventsTitle'))}</h2><p>${esc(px('eventsIntro'))}</p></div><button type="button" id="refresh" ${requestPending?'disabled':''}>${esc(t('refresh'))}</button></div>${productFilters(view)}<p class="filter-result" role="status" aria-live="polite"><strong data-filtered-event-count>${visible.length}</strong> ${esc(px('results'))} ${esc(px('from'))} ${events.length} ${esc(px('loaded'))} · ${esc(px('filterNote'))}</p><p class="translation-note">${esc(t('translationNote'))}</p><section id="canonical-events" class="canonical-grid" data-canonical-count="${value(view.distinct_event_count)}">${ordered.map(e=>eventCard(e,view)).join('')||`<div class="research-empty"><h3>${esc(px(events.length?'noMatches':'noData'))}</h3><p>${esc(px(events.length?'noMatchesText':'noDataText'))}</p><button type="button" data-product-reset>${esc(px('clear'))}</button><p><a href="#data-source-status">${esc(t('navHealth'))}</a></p></div>`}</section></section>${integrationDiagnostics(view)}${reactionResearch(view)}<details id="recent-workspace" class="product-secondary" ${recent?'open':''}><summary>${esc(px('activity'))}<small>${recent?'':esc(px('activityEmpty'))}</small></summary><section id="news-items" class="news-intelligence-feed">${macroBrief(view)}${relatedNews(view)}</section></details>${latestNews(view)}<details id="map-workspace" class="product-secondary" data-product-map><summary>${esc(px('mapWorkspace'))}<small>${esc(px('mapSecondary'))}</small></summary>${worldMap(view)}</details>${predictionMarketWatch(view)}<details id="news-provenance" class="support-details"><summary>${esc(t('newsProvenance'))}</summary><p>${esc(t('newsIntro'))}</p><p>${esc(t('freshnessTruth'))}</p></details><details id="data-source-status" class="support-details"><summary>${esc(t('dataSourceStatus'))}</summary>${compactSourceHealth(view)}${readingGuide(view)}${discoverySources(view)}${dataHealth(view)}${ingestionNotice(view)}</details><details id="source-health" class="support-details"><summary>${esc(t('sourceDetails'))}</summary><p>${esc(t('healthNote'))}</p><div class="availability">${Object.entries(view.sources||{}).map(([key,state])=>`<div><h3>${esc(t(key==='news'?'newsSource':key==='official'?'officialSource':key))}</h3>${stateLabel(state.status)}<p>${esc(t('lastSuccess'))}: ${value(state.last_success_at)}</p></div>`).join('')}</div></details><details class="provenance"><summary>${esc(t('grouping'))}</summary><p>${esc(t('groupNote'))}</p><p>${esc(t('unassigned'))}: ${value(view.unassigned_article_count)}</p></details><footer>${esc(t('footer'))}</footer></div>`}
function render(){saveLocalFilters();researchDisplayedAt=new Date().toISOString();const interaction=productSaveInteraction();const openDetails=new Set(Array.from(document.querySelectorAll?.('.event-intelligence-detail[open]')||[]).map(d=>d.closest('article')?.dataset.eventId));document.documentElement.lang=language;document.title=t('brand');document.getElementById('brand').textContent=t('brand');document.querySelectorAll('[data-language]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.language===language)));const app=document.getElementById('app');window.RadarWorldMap?.unmount();app.setAttribute('aria-busy',String(requestPending));productMapHost=null;app.innerHTML=productLoadFeedback()+(currentView?eventFeed(currentView):lastError?'':`<section class="loading-shell" role="status"><h1>${esc(px('reading'))}</h1><div class="loading-line"></div><div class="loading-line short"></div><p>${esc(px('captureNote'))}</p></section>`);if(typeof document.querySelector==='function'){for(const id of openDetails){const d=document.getElementById('event-'+id)?.querySelector('.event-intelligence-detail');if(d)d.open=true}productRestoreInteraction(interaction);if(selectedProductEvent)document.getElementById('event-'+selectedProductEvent)?.classList.add('selected-product-event');mountProductMap()}if(selectedImpactArticle&&typeof document.querySelector==='function')activateImpact(selectedImpactArticle,false)}
function setLanguage(next){if(!Object.hasOwn(STRINGS,next))return;language=next;try{localStorage.setItem('radar-language',language)}catch{}render()}
async function load(){if(requestPending)return;requestPending=true;lastError=null;render();const controller=typeof AbortController==='function'?new AbortController():null;const timer=controller&&typeof setTimeout==='function'?setTimeout(()=>controller.abort(),120000):null;try{const response=await fetch('/api/app/radar?'+new URLSearchParams({profile:new URLSearchParams(location.search).get('profile')||'public',window:new URLSearchParams(location.search).get('window')||'168'}),controller?{signal:controller.signal}:undefined);if(!response.ok)throw Error('HTTP_'+response.status);let view;try{view=await response.json()}catch{throw Error('INVALID_RESPONSE')}if(!view||!Array.isArray(view.items)||!Array.isArray(view.events)||view.canonical_event_contract!=='CANONICAL_EVENT_V0')throw Error('INVALID_RESPONSE');currentView=window.RadarProductWorkbench.validateRadar(view);lastSuccessfulReadAt=new Date().toISOString()}catch(error){lastError=error.name==='AbortError'?'REQUEST_TIMEOUT':/^HTTP_\d{3}$/.test(error.message)?error.message:/^(INVALID_RESPONSE|INVALID_DATA_RELATIONSHIP|CONFLICTING_RECORD_ID|INVALID_MACROVIEW_RELATIONSHIP)$/.test(error.message)?error.message:'NETWORK_UNAVAILABLE'}finally{if(timer!==null&&typeof clearTimeout==='function')clearTimeout(timer);requestPending=false;render();if(!lastError)productApplyRoute()}}
document.getElementById('language-control').addEventListener('click',event=>{const button=event.target.closest('[data-language]');if(button)setLanguage(button.dataset.language)});
document.addEventListener('radar-map-event',event=>{if(typeof event.detail?.eventId==='string')activateMapTarget({dataset:{mapEvent:event.detail.eventId}})});
document.getElementById('app').addEventListener('click',event=>{const button=event.target.closest('[data-open-news-research]');if(!button)return;selectedNewsResearchReference=button.dataset.openNewsResearch;render();Array.from(document.querySelectorAll('[data-news-workspace]')).find(n=>n.dataset.newsWorkspace===selectedNewsResearchReference)?.scrollIntoView({block:'start',behavior:'auto'})});
document.getElementById('app').addEventListener('change',event=>{const control=event.target.closest('[data-research-compare]');if(!control)return;if(control.dataset.researchCompare==='left')comparisonLeft=control.value;else comparisonRight=control.value;render()});
document.getElementById('app').addEventListener('click',event=>{const researchCase=event.target.closest('[data-news-research-case]');if(!researchCase)return;selectedResearchCaseId=researchCase.dataset.newsResearchCase;render();document.getElementById('research-case-'+selectedResearchCaseId)?.scrollIntoView({block:'center',behavior:'auto'})});
document.getElementById('app').addEventListener('keydown',event=>{if(['Enter',' '].includes(event.key)&&event.target.matches('[data-reaction-index]')){event.preventDefault();inspectReaction(event.target)}});
document.getElementById('app').addEventListener('click',event=>{const navLink=event.target.closest('.section-nav a[href^="#"]');if(navLink){const section=document.getElementById(navLink.getAttribute('href').slice(1));if(section)section.scrollIntoView({block:'start',behavior:'auto'});return;}const quote=event.target.closest('[data-reaction-index]');if(quote){inspectReaction(quote);return;}const researchTarget=event.target.closest('[data-research-case]');if(researchTarget){selectedResearchCaseId=researchTarget.dataset.researchCase;render();document.getElementById('selected-research-detail')?.scrollIntoView({block:'start',behavior:'auto'});return;}const impactTarget=event.target.closest('[data-impact-article]');if(impactTarget){event.preventDefault();activateImpact(impactTarget.dataset.impactArticle);return;}const newsFilter=event.target.closest('[data-news-window]');if(newsFilter){newsWindow=newsFilter.dataset.newsWindow;render();document.querySelector('[data-news-window="'+newsWindow+'"]').focus();return;}const watchFilter=event.target.closest('[data-watch-category],[data-watch-state]');if(watchFilter){if(watchFilter.dataset.watchCategory)watchCategory=watchFilter.dataset.watchCategory;if(watchFilter.dataset.watchState)watchState=watchFilter.dataset.watchState;const key=watchFilter.dataset.watchCategory?'data-watch-category':'data-watch-state';const val=watchFilter.dataset.watchCategory||watchFilter.dataset.watchState;render();document.querySelector('['+key+'="'+val+'"]').focus();return;}const filter=event.target.closest('[data-map-filter]');if(filter){mapFilter=filter.dataset.mapFilter;render();document.querySelector('[data-map-filter=\"'+mapFilter+'\"]').focus();return;}const labTarget=event.target.closest('[data-lab-query]');if(labTarget){const lab=currentView?.local_research_lab;if(currentView?.data_scope==='SYNTHETIC_TEST_FIXTURE'&&lab?.scope==='SYNTHETIC_LOCAL_RESEARCH_LAB_ONLY'&&lab.event_id===labTarget.dataset.labEvent&&lab.checkpoints.includes(labTarget.dataset.labQuery)){const input=document.getElementById('replay-time-'+lab.event_id);if(input){input.value=labTarget.dataset.labQuery;loadReplay(lab.event_id,'research')}}return}const researchTargetRead=event.target.closest('[data-research-request]');if(researchTargetRead){loadReplay(researchTargetRead.dataset.researchRequest,'research');return}const replayTarget=event.target.closest('[data-replay-request]');if(replayTarget){loadReplay(replayTarget.dataset.replayRequest);return}const mapTarget=event.target.closest('[data-map-event],[data-map-list]');if(mapTarget){event.preventDefault();activateMapTarget(mapTarget);return}if(event.target.closest('#refresh'))load()});
document.getElementById('app').addEventListener('submit',event=>{if(event.target.id==='research-filters')event.preventDefault()});
document.getElementById('app').addEventListener('input',event=>{if(event.target.id==='research-query'){clearEventRouteOnFilter();productQuery=event.target.value.slice(0,160);if(productFilterTimer)clearTimeout(productFilterTimer);productFilterTimer=setTimeout(()=>{productFilterTimer=null;render()},120)}});
document.getElementById('app').addEventListener('change',event=>{if(event.target.id==='research-source'){clearEventRouteOnFilter();productSource=event.target.value;render()}else if(event.target.id==='research-evidence'){clearEventRouteOnFilter();productEvidence=event.target.value;render()}});
document.getElementById('app').addEventListener('click',event=>{const target=event.target;if(target.closest('[data-product-reset]')){resetProductFilters();return}if(target.closest('[data-product-retry]')){load();return}const action=target.closest('[data-event-panel]');if(action){event.preventDefault();productOpenEvent(action.dataset.productEvent,action.dataset.eventPanel);return}const link=target.closest('a[href^="#"]');if(link){const hash=link.getAttribute('href');if(hash.startsWith('#/event/')){event.preventDefault();if(typeof history!=='undefined')history.pushState(null,'',hash);productApplyRoute()}else if(hash!=='#/feed'){const section=document.getElementById(hash.slice(1));if(section){event.preventDefault();if(section.tagName==='DETAILS')section.open=true;for(let n=section.parentElement;n;n=n.parentElement)if(n.tagName==='DETAILS')n.open=true;if(typeof history!=='undefined')history.pushState(null,'',hash);mountProductMap();section.scrollIntoView({block:'start',behavior:'auto'});section.setAttribute('tabindex','-1');section.focus({preventScroll:true})}}}});
document.getElementById('app').addEventListener('toggle',event=>{if(event.target.id==='map-workspace'&&event.target.open)mountProductMap()},true);
if(typeof window.addEventListener==='function'){window.addEventListener('hashchange',productApplyRoute);window.addEventListener('popstate',productApplyRoute)}
load();
