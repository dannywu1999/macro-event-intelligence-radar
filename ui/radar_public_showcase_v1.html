function contextPanel(event){const ctx=event.context_geography;if(!ctx)return '';const institutions=event.institution_context||[];const label=language==='zh-TW';return `<section class="context-intelligence" data-context-contract="${esc(event.context_contract)}"><strong>${esc(t('contextGeo'))}: ${value(ctx.status==='MULTI_REGION'?t('multiRegion'):label?ctx.display_name_zh:ctx.display_name)}</strong><p class="context-method">${value(t(ctx.confidence))} · ${value(t(ctx.method))}</p><p class="context-geo">${value(label?ctx.reason_zh:ctx.reason)}</p><p>${esc(t('contextOnly'))}</p><p>${esc(t('eventGeoStrict'))}: ${value(event.event_geography?.status==='KNOWN'?t('verifiedLocation'):t('noLocation'))}</p>${institutions.map(i=>`<section class="institution-definition" data-institution-id="${esc(i.institution_id)}"><strong>${value(i.short_name)}</strong><span>${value(i.official_name)}</span><span lang="zh-TW">${value(i.official_name_zh)}</span><dl><dt>${esc(t('institutionType'))}</dt><dd>${value(label?i.institution_type_zh:i.institution_type)}</dd><dt>${esc(t('jurisdiction'))}</dt><dd>${value(label?i.jurisdiction_zh:i.jurisdiction)}</dd><dt>${esc(t('headquarters'))}</dt><dd>${value(label?i.headquarters_zh:i.headquarters)}</dd><dt>${esc(t('currency'))}</dt><dd>${value(i.relevant_currency)}</dd></dl>${sourceLink(i.reference_url,t('details'))}</section>`).join('')}${event.headline_explanation?.explanation_en?`<strong>${esc(t('whatThisMeans'))}</strong><p class="context-explanation">${value(label?event.headline_explanation.explanation_zh:event.headline_explanation.explanation_en)}</p>`:''}</section>`}

const replayStates=new Map();
const t=key=>STRINGS[language][key]||key;
const value=text=>esc(text==null||text===''?t('unknown'):text);
function stateLabel(state){return ({UNKNOWN:t('unknown'),AVAILABLE:t('available'),UNAVAILABLE:t('unavailable'),NOT_CONFIGURED:t('notConfigured'),STALE:t('stale'),FRESH:t('fresh')})[state]||value(state)}
function sourceLink(url,label){if(typeof url!=='string'||!url.trim())return t('notAvailable');try{const parsed=new URL(url);if(!['http:','https:'].includes(parsed.protocol))return t('notAvailable');return `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(label||url)}</a>`}catch{return t('notAvailable')}}
function translated(kind,id){if(!APP_CONFIG.demoMode||language!=='zh-TW')return null;const metadata=window.RADAR_DEMO_TRANSLATIONS;if(metadata?.presentation_only!==true)return null;return metadata[kind]?.[id]||null}
function linkedEvidence(event,view){const ids=new Set(event.official_evidence_ids||[]);return (view.official_evidence||[]).filter(e=>ids.has(e.official_evidence_id)&&e.canonical_event_id===event.event_id&&e.evidence_status==='OFFICIAL_CONFIRMED'&&typeof e.fact_proposition==='string'&&e.fact_proposition.trim())}
function statusBadge(kind){return `<span class="status ${kind==='confirmed'?'confirmed':''}">${esc(t(kind))}</span>`}
function officialPanel(records){return `<details class="official-panel" open><summary>${esc(t('official'))}</summary><p class="specific-only">${esc(t('specificOnly'))}</p>${records.map(e=>{const zh=translated('facts',e.official_evidence_id);return `<section class="official-record" data-evidence-status="${esc(e.evidence_status)}"><div>${statusBadge('confirmed')}</div><div class="state-code">OFFICIAL_CONFIRMED · ${esc(t('propositionOnly'))}</div><span class="field-label">${esc(t('authority'))}</span><strong>${value(e.authority_name)}</strong><span class="field-label">${esc(t('fact'))}${zh?' · '+esc(t('translation')):''}</span>${zh?`<p class="official-fact" data-presentation-only="true" lang="zh-TW">${esc(zh)}</p>`:''}<span class="field-label">${esc(t('originalEvidence'))}</span><p class="official-original" lang="en">${value(e.fact_proposition)}</p><span class="field-label">${esc(t('document'))}</span><div lang="en">${value(e.document_title)}</div><div class="event-meta">${esc(t('published'))}: <time>${value(e.published_at)}</time></div><div>${sourceLink(e.document_url,t('officialLink'))}</div><details class="provenance"><summary>${esc(t('details'))}</summary><p>${esc(t('evidenceRef'))}: ${value(e.official_evidence_id)}</p><p>${esc(t('reference'))}: ${value(e.document_reference)}</p><p>${esc(t('firstSeen'))}: ${value(e.first_seen_at)}</p><p>${esc(t('retrieved'))}: ${value(e.retrieved_at)}</p><p>${esc(t('linkStatus'))}: ${value(e.link_status)}</p></details></section>`}).join('')}</details>`}
function timelineTime(iso){if(typeof iso!=='string'||!iso.trim()||!/(?:Z|[+-]\d{2}:\d{2})$/.test(iso))return esc(t('unknownTime'));const date=new Date(iso);if(!Number.isFinite(date.getTime()))return esc(t('unknownTime'));const formatted=new Intl.DateTimeFormat(language,{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',timeZone:'UTC',hour12:false}).format(date);return `<time datetime="${esc(iso)}" title="${esc(iso)}">${esc(formatted)} UTC</time>`}
function timelineEntry(entry,event){const official=entry.entry_type==='OFFICIAL_EVIDENCE';const role={REPORTED_AT:'timelineReported',OBSERVED_AT:'timelineDetected',EVIDENCE_PUBLISHED_AT:'evidencePublished',EVIDENCE_FIRST_SEEN_AT:'evidenceObserved',EVIDENCE_RETRIEVED_AT:'evidenceRetrieved',UNKNOWN:'unknownTime'}[entry.timestamp_role]||'unknownTime';const translatedTitle=official?translated('facts',entry.official_evidence_id):(event.article_count===1&&entry.title===event.event_title?translated('events',event.event_id):null);return `<li class="timeline-entry ${official?'official':'news'}" data-timeline-type="${esc(entry.entry_type)}" data-timestamp-role="${esc(entry.timestamp_role)}" data-timeline-id="${esc(entry.timeline_entry_id)}"><div class="entry-heading">${esc(t(official?'official':'newsDiscovered'))}</div><p>${esc(t(role))}: ${timelineTime(entry.timestamp)}</p>${translatedTitle?`<div class="translation-label">${esc(t('translation'))}</div><h4 data-timeline-presentation-only="true" lang="zh-TW">${esc(translatedTitle)}</h4>`:''}<h4 class="${translatedTitle?'original-entry':''}" lang="en">${value(entry.title)}</h4><p>${esc(t('source'))}: ${value(entry.source_name)}</p>${official?`<p>${esc(t('published'))}: ${entry.published_at?timelineTime(entry.published_at):value(null)}</p><p>${esc(t('specificOnly'))}</p>`:`<p>${esc(t('timelineDetected'))}: ${timelineTime(entry.observed_at)}</p>`}<p>${sourceLink(entry.source_url,t(official?'officialLink':'articleLink'))}</p><div class="state-code">${esc(entry.status)}${official?' · '+esc(t('propositionOnly')):''}</div></li>`}
function eventTimeline(event){const entries=Array.isArray(event.timeline)?event.timeline:[];const known=entries.filter(e=>e.timestamp!==null),unknown=entries.filter(e=>e.timestamp===null);const summary=event.status_summary||{};const news=entries.filter(e=>e.entry_type==='NEWS_DISCOVERED').length,official=entries.filter(e=>e.entry_type==='OFFICIAL_EVIDENCE').length;return `<details class="event-timeline" ${official?'open':''}><summary>${esc(t('viewTimeline'))} · ${esc(t('timeline'))}</summary><div class="timeline-summary"><span>${entries.length} ${esc(t('timelineEntries'))}</span><span>${news} ${esc(t('newsReports'))}</span><span>${official} ${esc(t('evidenceItems'))}</span></div><p class="timeline-note">${esc(t('timelineNote'))}</p>${known.length?`<ol class="timeline-list">${known.map(e=>timelineEntry(e,event)).join('')}</ol>`:''}${unknown.length?`<section class="timeline-unknown"><h4>${esc(t('unknownTime'))}</h4><ol class="timeline-list">${unknown.map(e=>timelineEntry(e,event)).join('')}</ol></section>`:''}${entries.length?'':`<p class="timeline-note">${esc(t('timelineEmpty'))}</p>`}<aside class="timeline-current"><strong>${esc(t('currentState'))}</strong><div class="state-code">${value(summary.verification_status||event.verification_status)}</div><p>${esc(t('brandTimeline'))}</p><p>${news} ${esc(t('newsReports'))} · ${official} ${esc(t('evidenceItems'))}</p>${official?'':`<p>${esc(t('noEvidence'))}</p>`}</aside></details>`}
function mapPoints(event){return event.geography_status==='KNOWN'&&Array.isArray(event.geography)?event.geography.filter(point=>point&&typeof point.geography_id==='string'&&point.evidence_type==='CURATED_PRESENTATION'&&typeof point.place_name==='string'&&typeof point.latitude==='number'&&typeof point.longitude==='number'&&Number.isFinite(point.latitude)&&Number.isFinite(point.longitude)&&point.latitude>=-90&&point.latitude<=90&&point.longitude>=-180&&point.longitude<=180):[]}

const events=Array.isArray(view.events)?view.events:[],groups=new Map(),mapped=new Set(),verified=new Set(),contextEvents=new Set();

function researchCard(c){const r=c.receipt,fact=c.official_evidence?.[0]?.fact_proposition||t('unknown');return `<button id="research-case-${esc(c.research_case_id)}" type="button" class="research-case-card ${c.research_case_id===selectedResearchCaseId?'selected':''}" data-research-case="${esc(c.research_case_id)}" aria-pressed="${c.research_case_id===selectedResearchCaseId}"><span class="eyebrow">${esc(r.event_date)} · EX_POST</span><strong>${esc(c.article.title)}</strong><span>${esc(fact)}</span><span class="research-card-change">${Number(r.percentage_change)>0?'+':''}${esc(r.percentage_change)}% · ${esc(r.instrument_id)}</span><span>${esc(t('exploreResearch'))} ↗</span></button>`}
function comparisonChart(a,b){const vals=[Number(a.receipt.percentage_change),Number(b.receipt.percentage_change)],max=Math.max(...vals.map(Math.abs),.1),W=680,H=154,C=340,scale=290/(max*1.18),items=[a,b];return `<svg class="comparison-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${rx('Observed ECB EUR/USD daily reference percentage changes, not a performance score','ECB EUR/USD 每日參考匯率變化，不是績效評分')}"><line x1="${C}" x2="${C}" y1="8" y2="${H-12}" stroke="#748b98" stroke-dasharray="4 4"/><text x="${C}" y="14" text-anchor="middle" fill="#b9cbd3">0%</text>${items.map((c,i)=>{const v=Number(c.receipt.percentage_change),w=Math.abs(v)*scale,y=42+i*54,x=v>=0?C:C-w;return `<text x="8" y="${y+16}" fill="#d7e8ee">${esc(c.receipt.event_date)}</text><rect x="${x}" y="${y}" width="${Math.max(1,w)}" height="26" rx="5" fill="${v>=0?'#86d8c8':'#e5a47d'}"/><text x="${v>=0?x+w+8:x-8}" y="${y+18}" text-anchor="${v>=0?'start':'end'}" fill="#f2f6f8">${v>0?'+':''}${v.toFixed(6)}%</text>`}).join('')}</svg>`}
function compareCases(view,cases){if(cases.length<2)return `<p class="comparison-empty" role="status">${esc(t('comparisonUnavailable'))}</p>`;ensureResearchSelection(cases);const left=cases.find(c=>c.research_case_id===comparisonLeft)||cases[0],right=cases.find(c=>c.research_case_id===comparisonRight&&c.research_case_id!==left.research_case_id)||cases.find(c=>c.research_case_id!==left.research_case_id);if(!right)return `<p role="status">${esc(t('selectTwoCases'))}</p>`;comparisonRight=right.research_case_id;const a=left.receipt,b=right.receipt,compatible=a.instrument_id===b.instrument_id&&a.market_data_provider===b.market_data_provider&&a.data_frequency===b.data_frequency;const optionList=(selectedId)=>cases.map(c=>`<option value="${esc(c.research_case_id)}"${c.research_case_id===selectedId?' selected':''}>${esc(c.receipt.event_date)} · ${esc(c.article.title)}</option>`).join('');return `<section class="research-comparison" id="event-comparison"><div class="section-head"><div><h3>${esc(t('comparisonTitle'))}</h3><p>${esc(t('comparisonSubtitle'))}</p></div></div><div class="comparison-controls"><label>${esc(t('caseOne'))}<select data-research-compare="left">${optionList(comparisonLeft)}</select></label><label>${esc(t('caseTwo'))}<select data-research-compare="right">${optionList(comparisonRight)}</select></label></div>${left.research_case_id===right.research_case_id?`<p role="status">${esc(t('selectTwoCases'))}</p>`:!compatible?`<p role="status">${esc(t('comparisonIncompatible'))}</p>`:`<p class="comparison-direction">${rx('EUR/USD higher means more USD per EUR; lower means fewer USD per EUR. No direction is interpreted as ECB confirmation.','EUR/USD 上升表示每歐元可換得更多美元；下降則更少。方向不視為 ECB 假說獲得驗證。')}</p>${comparisonChart(left,right)}<div class="comparison-table-wrap"><table class="comparison-table"><thead><tr><th>${esc(t('comparisonField'))}</th><th>${esc(a.event_date)}</th><th>${esc(b.event_date)}</th></tr></thead><tbody><tr><th>${esc(t('eventDecision'))}</th><td>${esc(left.official_evidence?.[0]?.fact_proposition||t('unknown'))}</td><td>${esc(right.official_evidence?.[0]?.fact_proposition||t('unknown'))}</td></tr><tr><th>${esc(t('instrument'))}</th><td>${esc(a.instrument_name)} · ${esc(a.data_frequency)}</td><td>${esc(b.instrument_name)} · ${esc(b.data_frequency)}</td></tr><tr><th>${esc(t('providerWindow'))}</th><td>${esc(a.pre_event_observation.observation_date)} ${esc(a.pre_event_observation.value)} → ${esc(a.post_event_observation.observation_date)} ${esc(a.post_event_observation.value)}</td><td>${esc(b.pre_event_observation.observation_date)} ${esc(b.pre_event_observation.value)} → ${esc(b.post_event_observation.observation_date)} ${esc(b.post_event_observation.value)}</td></tr><tr><th>${esc(t('observedChange'))}</th><td>${Number(a.absolute_change)>0?'+':''}${esc(a.absolute_change)} USD/EUR · ${Number(a.percentage_change)>0?'+':''}${esc(a.percentage_change)}%</td><td>${Number(b.absolute_change)>0?'+':''}${esc(b.absolute_change)} USD/EUR · ${Number(b.percentage_change)>0?'+':''}${esc(b.percentage_change)}%</td></tr><tr><th>${esc(t('elapsedWindow'))}</th><td>${value(a.elapsed_calendar_days)} ${esc(t('calendarDays'))}</td><td>${value(b.elapsed_calendar_days)} ${esc(t('calendarDays'))}</td></tr><tr><th>${esc(t('evidenceQuality'))}</th><td>${esc(a.observation_quality)} · DATE_ONLY</td><td>${esc(b.observation_quality)} · DATE_ONLY</td></tr><tr><th>${esc(t('causalStatus'))}</th><td>${esc(a.causal_attribution_status)} · EX_POST</td><td>${esc(b.causal_attribution_status)} · EX_POST</td></tr></tbody></table></div><p class="comparison-limits">${rx('Same provider, instrument and daily frequency; elapsed windows differ and remain visible. These are descriptive observations, not causal effects, abnormal returns, a win rate or a forecast. No aggregate score is calculated.','提供者、工具與日頻率相同，但觀測窗口長度不同且明確列出。這些是描述性觀測，不是因果效果、異常報酬、勝率或預測；不計算彙總分數。')}</p>`}</section>`}
function reactionResearch(view){const library=view.market_research_library,cases=researchCases(view);ensureResearchSelection(cases);if(!cases.length)return `<section class="reaction-case research-workbench" id="market-reaction-research"><span id="historical-research"></span><h2>${esc(t('historicalResearch'))}</h2><p>NOT_MEASURED · ${rx('No prices or chart are fabricated.','不捏造價格或圖表。')} · ${esc(t('comparisonUnavailable'))}</p></section>`;const selected=cases.find(c=>c.research_case_id===selectedResearchCaseId)||cases[0],scoped={...view,items:[selected.article],official_evidence:selected.official_evidence,impact_intelligence:selected.impact_intelligence,market_research_library:library};return `<section class="reaction-case research-workbench" id="market-reaction-research"><span id="historical-research"></span><div class="eyebrow">${esc(t('researchEyebrow'))} · EX_POST</div><h2>${esc(t('historicalResearch'))}</h2><p class="research-intro">${esc(t('researchIntro'))}</p><button type="button" class="explore-impact" data-impact-article="${esc(selected.article.article_reference)}">${esc(t('exploreResearch'))} ↗</button><div class="research-metrics"><span>${esc(t('totalCases'))}: <strong>${value(library.total_case_count)}</strong></span><span>${esc(t('observedPriceCases'))}: <strong>${value(library.observed_price_case_count)}</strong></span><span>${esc(t('notMeasuredCases'))}: <strong>${value(library.not_measured_case_count)}</strong></span><span>${esc(t('officialCases'))}: <strong>${value(library.official_case_count)}</strong></span><span>${esc(t('comparablePairs'))}: <strong>${value(library.comparable_pair_count)}</strong></span><span>${esc(t('pitCases'))}: <strong>${value(library.pit_replay_case_count)}</strong></span></div><div class="research-card-grid">${cases.map(researchCard).join('')}</div><section class="research-selected" id="selected-research-detail"><div class="eyebrow">${esc(selected.receipt.event_date)} · ${esc(selected.receipt.event_timestamp_precision)} · EX function unlinkedExpectations(view){const state=view.expectation_provider;const provider=state?.enabled===true?`<aside class="expectation-panel expectation-provider"><h2>${esc(t('marketExpectations'))} · Polymarket</h2><p>${value(state.status)} · ${esc(t('lastRefresh'))}: <time>${value(state.last_success_at)}</time></p><p>${esc(t('marketDisclosure'))}</p></aside>`:'';const records=(view.market_expectations||[]).filter(r=>r.link_status==='UNLINKED');return records.length?provider+`<details class="expectation-panel unlinked-expectations"><summary>${esc(t('unlinkedMarkets'))} · ${records.length}</summary><p>${esc(t('marketDisclosure'))}</p>${expectationRows(records)}</details>`:provider}

function predictionMarketWatch(view){const watch=view.prediction_market_watch;if(!watch)return unlinkedExpectations(view);const stateNames={ACTIVE:'watchActive',CLOSED:'watchClosed',UNKNOWN:'watchUnknown'};const markets=watch.markets||[];const visible=markets.filter(m=>(watchCategory==='ALL'||m.category===watchCategory)&&(watchState==='ALL'||m.market_status===watchState));const categories=['ALL',...(watch.categories||[])];const states=['ALL',...['ACTIVE','CLOSED','UNKNOWN'].filter(s=>markets.some(m=>m.market_status===s))];const cards=visible.map(m=>`<article class="watch-card" data-market-id="${esc(m.market_id)}" data-watch-source="${esc(m.source_status)}"><div class="watch-badges"><span>${esc(t(m.category))}</span><span>${esc(t(stateNames[m.market_status]||'watchUnknown'))}</span><span>${esc(t(m.source_status))}</span></div>${marketQuestion(m)}<div class="state-code">${esc(t('expectationOnly'))} · EXPECTATION_SENSOR · ${esc(t(m.outcome_type))}</div><span class="field-label">${esc(t('watchPrice'))}</span><ul class="watch-outcomes">${Array.isArray(m.outcomes)?m.outcomes.map((o,i)=>`<li><span>${marketOutcome(o)}</span><strong>${expectationProbability(m.probabilities?.[i])}</strong></li>`).join(''):`<li>${value(null)}</li>`}</ul><div class="watch-updated"><span>${esc(t('watchObserved'))}: <time>${value(m.observed_at)}</time></span><span>${esc(t('watchUpdated'))}: <time>${value(m.provider_updated_at)}</time></span></div><p>${sourceLink(m.market_url,t('viewMarket'))}</p>${m.link_status==='LINKED'&&m.canonical_event_id?`<button type="button" data-map-event="${esc(m.canonical_event_id)}">${esc(t('watchRelated'))}</button>`:`<p class="watch-meta">${esc(t('watchNoLink'))}</p>`}<details><summary>${esc(t('watchDetails'))}</summary><p>${esc(t('watchGroup'))}: ${value(m.provider_event_ids?.join(' · ')||null)}</p><p>${esc(t('watchRelevance'))}: ${value(m.relevance_reason)}</p><p>${esc(t('watchOutcomeIds'))}: ${value(m.outcome_identifiers?.join(' · ')||null)}</p><p>${esc(t('watchLiquidity'))}: ${value(m.liquidity)} · ${esc(t('watchVolume'))}: ${value(m.volume)}</p><p>${value(m.proposition_metadata?.resolution_criteria||m.proposition_metadata?.description)}</p>${sourceLink(m.proposition_metadata?.resolution_source,t('source'))}</details></article>`).join('');return `<section id="prediction-market-watch" class="prediction-watch" aria-label="${esc(t('watchTitle'))}"><h2>${esc(t('watchTitle'))}</h2><p class="watch-disclosure">${esc(t('watchIntro'))}</p><p class="watch-meta">Polymarket · ${esc(t(watch.source_status))} · ${esc(t('watchCount'))}: ${value(watch.market_count)} ${watch.provider?.reason?`<span class="state-code">${value(watch.provider.reason)}</span>`:''}</p><p class="watch-meta">${esc(t('guideLinkedMarkets'))}: ${markets.filter(m=>m.link_status==='LINKED'&&m.canonical_event_id).length} · ${esc(t('guideUnlinkedMarkets'))}: ${markets.filter(m=>m.link_status!=='LINKED'||!m.canonical_event_id).length}</p><div class="watch-filters" aria-label="${esc(t('watchTitle'))}">${categories.map(c=>`<button type="button" data-watch-category="${esc(c)}" aria-pressed="${c===watchCategory}">${esc(t(c==='ALL'?'allMacro':c))}</button>`).join('')}</div><div class="watch-filters">${states.map(s=>`<button type="button" data-watch-state="${esc(s)}" aria-pressed="${s===watchState}">${esc(t(s==='ALL'?'watchAllStates':stateNames[s]))}</button>`).join('')}</div><div class="watch-grid">${cards||`<p class="empty">${esc(t(watch.status==='UNAVAILABLE'?'watchUnavailable':markets.length?'watchNoFilter':'watchEmpty'))}</p>`}</div><p class="watch-disclosure">${esc(t('watchOutcomeNote'))}</p><p class="watch-disclosure">${esc(t('watchScope'))}</p></section>`}
function macroviewPanel(event,view){const preview=(view.macroview_previews||[]).find(p=>p.canonical_event_id===event.event_id&&p.preview_only===true&&p.persisted===false);if(!preview)return `<p>${esc(t('UNAVAILABLE_HISTORY'))}</p>`;return `<details class="macroview-preview" data-macroview-id="${esc(preview.macroview_id)}"><summary>${esc(t('macroview'))} · PREVIEW</summary><p class="knowledge-state">${esc(t('PREVIEW'))}</p><p>${esc(t('knowledgeNote'))}</p><p>${esc(t('macroviewNote'))}</p><span class="field-label">${esc(t('facts'))}</span><strong>${esc(t(preview.fact_state))}</strong><ul>${(preview.snapshot?.official_evidence||[]).map(e=>`<li>${value(e.authority_name)}: ${value(e.fact_proposition)}</li>`).join('')}</ul><span class="field-label">${esc(t('expectations'))}</span><strong>${esc(t(preview.expectation_state))}</strong>${expectationRows(preview.snapshot?.market_expectations||[])}<p>${esc(t('marketDisclosure'))}</p><span class="field-label">${esc(t('unknowns'))}</span><ul>${(preview.unknowns||[]).map(key=>`<li>${esc(t(key))}</li>`).join('')}</ul><details class="provenance"><summary>${esc(t('details'))}</summary><p>${value(preview.macroview_id)}</p><p>${value(preview.provenance?.snapshot_sha256)}</p></details></details>`}
function replayResult(result){if(result.replay_status==='NO_OBSERVATIONS')return `<p>${esc(t('replayEmpty'))}</p>`;const groups=[['news_observations','replayNews'],['official_evidence_observations','replayOfficial'],['market_expectation_observations','replayMarkets']];const snapshot=result.reconstructed_macroview;const replayContext=snapshot?.snapshot?.event;return `<p class="state-code">${value(result.replay_status)} · ${value(result.as_of)}</p>${groups.map(([key,label])=>`<h4>${esc(t(label))}: ${(result[key]||[]).length}</h4><ol>${(result[key]||[]).map(row=>`<li><strong>${value(row.payload?.title||row.payload?.fact_proposition||row.payload?.question)}</strong><p>${esc(t('replayObserved'))}: <time>${value(row.observed_at)}</time> · ${esc(t(row.active_at_as_of?'replayActive':'replayHistory'))}</p>${row.observation_kind==='MARKET_EXPECTATION'?`<p>EXPECTATION_SENSOR · ${value(row.payload?.probabilities)}</p>`:''}</li>`).join('')}</ol>`).join('')}${snapshot?`<h4>${esc(t('replayMacro'))}</h4><p>${esc(t(snapshot.fact_state))} · ${esc(t(snapshot.expectation_state))}</p>`:''}${replayContext?marketRealityPanel({...replayContext,market_reality:snapshot.snapshot.market_reality}):''}${replayContext?.context_contract?contextPanel(replayContext):`<p>${esc(t('contextNotObserved'))}</p>`}<h4>${esc(t('unknowns'))}</h4><ul>${(result.unknowns||[]).map(code=>`<li>${esc(t(code))}</li>`).join('')}</ul>`}
function realityReplay(event){const state=replayStates.get(event.event_id);const inputId='replay-time-'+event.event_id;return `<details class="reality-replay" ${state?'open':''}><summary>${esc(t('realityReplay'))}</summary><p>${esc(t('replayNote'))}</p><p>${esc(t('guideReplay'))}</p>${state?.result?'':`<p class="replay-knowledge-state">${esc(t('NO_RECORDED_HISTORY'))}</p>`}<div class="replay-controls"><label for="${esc(inputId)}">${esc(t('replayAsOf'))}<input id="${esc(inputId)}" type="text" autocomplete="off" placeholder="YYYY-MM-DDTHH:mm:ssZ" value="${esc(state?.asOf||'')}"></label><button type="button" data-replay-request="${esc(event.event_id)}" ${state?.loading?'disabled':''}>${esc(t('replayLoad'))}</button></div><div class="replay-result" aria-live="polite" role="status">${state?.loading?esc(t('replayLoading')):state?.error?`${esc(t('replayUnavailable'))} ${value(state.error)}`:state?.result?replayResult(state.result):''}</div></details>`}
async function loadReplay(eventId){const previous=replayStates.get(eventId);if(previous?.loading)return;const input=document.getElementById('replay-time-'+eventId);const asOf=input?.value?.trim()||'';replayStates.set(eventId,{asOf,loading:true});render();try{const response=await fetch('/api/app/replay?event_id='+encodeURIComponent(eventId)+'&as_of='+encodeURIComponent(asOf));const result=await response.json();if(!response.ok)throw Error(result.error||'REPLAY_UNAVAILABLE');if(result.contract_version!=='POINT_IN_TIME_REPLAY_V0'||result.canonical_event_id!==eventId)throw Error('INVALID_REPLAY_RESPONSE');replayStates.set(eventId,{asOf,loading:false,result})}catch(error){replayStates.set(eventId,{asOf,loading:false,error:error.message})}render()}
function eventCard(event,view){const records=linkedEvidence(event,view),zh=translated('events',event.event_id);const main=`<div class="event-main">${statusBadge('unverified')}<div class="state-code">${value(event.verification_status)}</div>${zh?`<div class="translation-label">${esc(t('translation'))}</div><h3 data-presentation-only="true" lang="zh-TW">${esc(zh)}</h3><div class="translation-label">${esc(t('original'))}</div><p class="original-title compact-title" lang="en">${value(event.event_title)}</p>`:`${language==='zh-TW'?`<div class="translation-label">${esc(t('originalOnly'))}</div>`:''}<h3 class="compact-title" lang="en">${value(event.event_title)}</h3>`}<div class="event-meta">${esc(t('source'))}: <strong>${value((event.source_names||[]).join(' · '))}</strong></div><div class="event-meta">${esc(t('articles'))}: <strong>${value(event.article_count)}</strong></div><div class="times"><div><span>${esc(t('detected'))}</span><time>${value(event.first_detected_at)}</time></div><div><span>${esc(t('latest'))}</span><time>${value(event.latest_article_at)}</time></div></div>${impactActions((view.items||[]).find(a=>a.article_reference===(event.article_references||[])[0])||{})}<details class="event-intelligence-detail"><summary>${esc(t('eventIntelligence'))} · ${records.length} ${esc(t('evidenceItems'))}</summary><details class="provenance"><summary>${esc(t('details'))}</summary><p>${esc(t('eventRef'))}: ${value(event.event_id)}</p><p lang="en">${value(event.event_title)}</p><p>${esc(t('occurred'))}: ${value(event.event_occurred_at)}</p><p>${esc(t('groupRule'))}: ${value(event.grouping?.rule)}</p>${(event.article_references||[]).map(ref=>`<p>${sourceLink(ref,t('articleLink'))} · ${value(ref)}</p>`).join('')}</details>${records.length?'':`<p class="no-evidence">${esc(t('noEvidence'))}</p>`}${eventImpactPanel(event,view)}${records.length?officialPanel(records):''}${sourceIntelligence(event,view)}${eventGeography(event)}${contextPanel(event)}${eventTimeline(event)}${expectationPanel(event,view)||`<p class="no-linked-expectation">${esc(t('noLinkedExpectation'))}</p>`}${marketRealityPanel(event)}${macroviewPanel(event,view)}${realityReplay(event)}</details></div>`;return `<article id="event-${esc(event.event_id)}" tabindex="-1" class="event-card ${records.length?'has-evidence':''}" data-event-id="${esc(event.event_id)}" data-event-status="${esc(event.verification_status)}">${main}</article>`}

function readingGuide(view){const previewCount=Array.isArray(view.macroview_previews)?view.macroview_previews.length:0;const realityAvailable=(view.events||[]).some(e=>['PARTIAL','COMPLETE'].includes(e.market_reality?.snapshot_status));return `<details class="product-guide"><summary>${esc(t('guideTitle'))}</summary><ul><li><strong>${esc(t('news'))}:</strong> ${esc(t('guideNews'))}</li><li><strong>${esc(t('official'))}:</strong> ${esc(t('guideOfficial'))}</li><li><strong>${esc(t('watchTitle'))}:</strong> ${esc(t('guideMarket'))}</li><li><strong>${esc(t('worldMap'))}:</strong> ${esc(t('guideMap'))}</li></ul><p>${esc(t('guideCapabilities'))}: ${previewCount} ${esc(t('macroview'))} · ${esc(t('guideReplay'))} ${esc(t('macroviewNote'))}</p><p>${esc(t(realityAvailable?'guideRealityAvailable':'guideRealityUnavailable'))}</p></details>`}
function dataHealth(view){return `<section class="data-health" aria-label="${esc(t('navHealth'))}"><span>${esc(t('latestObserved'))}: <strong>${value(view.latest_observed_data_at)}</strong></span><span>${esc(t('health'))}: <strong>${stateLabel(view.health_status)}</strong></span><p>${esc(t('guideObservedVsHealth'))}</p></section>`}
function eventFeed(view){const events=view.events||[];const officialIds=new Set(events.flatMap(e=>linkedEvidence(e,view).map(x=>x.official_evidence_id)));const ordered=[...events].sort((a,b)=>Number(linkedEvidence(b,view).length>0)-Number(linkedEvidence(a,view).length>0));return `<div class="radar-feed"><section class="hero"><div class="eyebrow">${esc(t('eyebrow'))}</div><h1>${esc(t('brand'))}</h1><h2 class="hero-research">${esc(t('heroResearch'))}</h2><p class="intro">${esc(t('heroSub'))}</p><div class="flow" aria-label="${esc(t('intro'))}">${stage('news','News Discovery',view.news_item_count??view.item_count,'newsCount','discover',1)}<div class="flow-arrow" aria-hidden="true"></div>${stage('events','Canonical Events',view.distinct_event_count,'eventCount','organize',2)}<div class="flow-arrow" aria-hidden="true"></div>${stage('official','Official Evidence',officialIds.size,'factCount','verify',3)}</div></section>${productGuide(view)}${compactSourceHealth(view)}<section id="news-items" class="news-intelligence-feed">${macroBrief(view)}${relatedNews(view)}</section>${worldMap(view)}${latestNews(view)}<section class="legend" aria-label="${esc(t('official'))}"><div>${statusBadge('unverified')}<p>${esc(t('unverifiedMeaning'))}</p></div><div>${statusBadge('confirmed')}<p>${esc(t('confirmedMeaning'))}</p></div></section><div class="section-head"><div><h2>${esc(t('events'))}</h2><p>${esc(t('eventIntro'))}</p></div><button type="button" id="refresh">${esc(t('refresh'))}</button></div><p class="translation-note">${esc(t('translationNote'))}</p><p class="translation-note">${esc(t('sortNote'))}</p><section id="canonical-events" class="canonical-grid" data-canonical-count="${value(view.distinct_event_count)}">${ordered.map(e=>eventCard(e,view)).join('')||`<p class="empty">${esc(t('empty'))}</p>`}</section>${reactionResearch(view)}${predictionMarketWatch(view)}<div class="context"><span>${esc(t('feed'))}: <strong>${stateLabel(view.status)}</strong></span><span>${esc(t('latestObserved'))}: <strong>${value(view.latest_observed_data_at)}</strong></span><span>${esc(t('health'))}: <strong>${stateLabel(view.health_status)}</strong></span></div><details id="news-provenance" class="support-details"><summary>${esc(t('newsProvenance'))}</summary><p>${esc(t('newsIntro'))}</p><p>${esc(t('freshnessTruth'))}</p></details><details id="data-source-status" class="support-details"><summary>${esc(t('dataSourceStatus'))}</summary>${readingGuide(view)}${discoverySources(view)}${dataHealth(view)}${ingestionNotice(view)}</details><details id="source-health" class="support-details"><summary>${esc(t('sourceDetails'))}</summary><p>${esc(t('healthNote'))}</p><div class="availability">${Object.entries(view.sources||{}).map(([key,state])=>`<div><h3>${esc(t(key==='news'?'newsSource':key==='official'?'officialSource':key))}</h3>${stateLabel(state.status)}<p>${esc(t('lastSuccess'))}: ${value(state.last_success_at)}</p></div>`).join('')}</div></details><details class="provenance"><summary>${esc(t('grouping'))}</summary><p>${esc(t('groupNote'))}</p><p>${esc(t('unassigned'))}: ${value(view.unassigned_article_count)}</p></details><footer>${esc(t('footer'))}</footer></div>`}
function render(){researchDisplayedAt=new Date().toISOString();const openDetails=new Set(Array.from(document.querySelectorAll?.('.event-intelligence-detail[open]')||[]).map(d=>d.closest('article')?.dataset.eventId));if(typeof document.querySelector==='function'&&typeof replayStates!=='undefined')for(const id of replayStates.keys())openDetails.add(id);document.documentElement.lang=language;document.title=t('brand');document.getElementById('brand').textContent=t('brand');document.querySelectorAll('[data-language]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.language===language)));const app=document.getElementById('app');window.RadarWorldMap?.unmount();app.setAttribute('aria-busy',String(requestPending));app.innerHTML=lastError?`<p class="error" role="alert">${esc(t('error'))}: ${esc(lastError)}</p>`:currentView?eventFeed(currentView):`<p role="status">${esc(t('load'))}</p>`;if(typeof document.querySelector==='function')for(const id of openDetails){const d=document.getElementById('event-'+id)?.querySelector('.event-intelligence-detail');if(d)d.open=true;}if(currentView&&!lastError)window.RadarWorldMap?.mount(app.querySelector?.('.world-map'),currentView,language,mapFilter);if(selectedImpactArticle&&typeof document.querySelector==='function')activateImpact(selectedImpactArticle,false)}
function setLanguage(next){if(!Object.hasOwn(STRINGS,next))return;language=next;try{localStorage.setItem('radar-language',language)}catch{}render()}
async function load(){if(requestPending)return;requestPending=true;lastError=null;render();try{const response=await fetch('/api/app/radar');const view=await response.json();if(!response.ok)throw Error(view.error||response.status);currentView=view}catch(error){lastError=error.message}finally{requestPending=false;render()}}
document.getElementById('language-control').addEventListener('click',event=>{const button=event.target.closest('[data-language]');if(button)setLanguage(button.dataset.language)});
document.addEventListener('radar-map-event',event=>{if(typeof event.detail?.eventId==='string')activateMapTarget({dataset:{mapEvent:event.detail.eventId}})});
document.getElementById('app').addEventListener('click',event=>{const button=event.target.closest('[data-open-news-research]');if(!button)return;selectedNewsResearchReference=button.dataset.openNewsResearch;render();Array.from(document.querySelectorAll('[data-news-workspace]')).find(n=>n.dataset.newsWorkspace===selectedNewsResearchReference)?.scrollIntoView({block:'start',behavior:'auto'})});
document.getElementById('app').addEventListener('change',event=>{const control=event.target.closest('[data-research-compare]');if(!control)return;if(control.dataset.researchCompare==='left')comparisonLeft=control.value;else comparisonRight=control.value;render()});
document.getElementById('app').addEventListener('click',event=>{const researchCase=event.target.closest('[data-news-research-case]');if(!researchCase)return;selectedResearchCaseId=researchCase.dataset.newsResearchCase;render();document.getElementById('research-case-'+selectedResearchCaseId)?.scrollIntoView({block:'center',behavior:'auto'})});
document.getElementById('app').addEventListener('keydown',event=>{if(['Enter',' '].includes(event.key)&&event.target.matches('[data-reaction-index]')){event.preventDefault();inspectReaction(event.target)}});
document.getElementById('app').addEventListener('click',event=>{const navLink=event.target.closest('.section-nav a[href^="#"]');if(navLink){const section=document.getElementById(navLink.getAttribute('href').slice(1));if(section)section.scrollIntoView({block:'start',behavior:'auto'});return;}const quote=event.target.closest('[data-reaction-index]');if(quote){inspectReaction(quote);return;}const researchTarget=event.target.closest('[data-research-case]');if(researchTarget){selectedResearchCaseId=researchTarget.dataset.researchCase;render();document.getElementById('selected-research-detail')?.scrollIntoView({block:'start',behavior:'auto'});return;}const impactTarget=event.target.closest('[data-impact-article]');if(impactTarget){event.preventDefault();activateImpact(impactTarget.dataset.impactArticle);return;}const newsFilter=event.target.closest('[data-news-window]');if(newsFilter){newsWindow=newsFilter.dataset.newsWindow;render();document.querySelector('[data-news-window="'+newsWindow+'"]').focus();return;}const watchFilter=event.target.closest('[data-watch-category],[data-watch-state]');if(watchFilter){if(watchFilter.dataset.watchCategory)watchCategory=watchFilter.dataset.watchCategory;if(watchFilter.dataset.watchState)watchState=watchFilter.dataset.watchState;const key=watchFilter.dataset.watchCategory?'data-watch-category':'data-watch-state';const val=watchFilter.dataset.watchCategory||watchFilter.dataset.watchState;render();document.querySelector('['+key+'="'+val+'"]').focus();return;}const filter=event.target.closest('[data-map-filter]');if(filter){mapFilter=filter.dataset.mapFilter;render();document.querySelector('[data-map-filter=\"'+mapFilter+'\"]').focus();return;}const replayTarget=event.target.closest('[data-replay-request]');if(replayTarget){loadReplay(replayTarget.dataset.replayRequest);return}const mapTarget=event.target.closest('[data-map-event],[data-map-list]');if(mapTarget){event.preventDefault();activateMapTarget(mapTarget);return}if(event.target.closest('#refresh'))load()});
load();
</script>
</body>
</html>
